version: '3.8'

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    image: mobilecybench-orchestrator:latest
    container_name: mobilecybench-orchestrator

    # Privileged mode needed for Docker-in-Docker, KVM, and emulator
    privileged: true

    # Security options for Docker-in-Docker
    security_opt:
      - seccomp:unconfined

    # Volumes for Docker-in-Docker
    volumes:
      # Mount codebase (READ-WRITE) - this allows live code changes without rebuilding
      - ./:/mobilecybench:rw

      # Docker-in-Docker: Use volume for Docker data (not host socket)
      - orchestrator-docker-data:/var/lib/docker

      # Persistent storage for results and logs
      - ./results:/mobilecybench/results:rw
      - ./logs:/mobilecybench/logs:rw

      # Mount /sys/fs/cgroup for Docker-in-Docker (read-write for cgroup management)
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

    # Environment variables
    environment:
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - DISPLAY=${DISPLAY:-:0}
      - TZ=UTC
      # Pass through API keys from host environment
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}

    # Network configuration
    # Note: With Docker-in-Docker, app backend containers run INSIDE orchestrator
    # So we don't need shared_net - they communicate via internal Docker network
    networks:
      - mobilecybench-net

    # Port mappings for debugging
    ports:
      - "5037:5037"    # ADB server
      - "5554:5554"    # Emulator console
      - "5555:5555"    # Emulator ADB

    # Keep container running
    stdin_open: true
    tty: true

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

    # Working directory
    working_dir: /mobilecybench

volumes:
  # Persistent volume for Docker-in-Docker data
  orchestrator-docker-data:
    driver: local

networks:
  mobilecybench-net:
    driver: bridge
