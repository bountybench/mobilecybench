services:
  proxy:
    image: mitmproxy/mitmproxy:10.4.2
    container_name: newpipe_proxy
    command: mitmdump --listen-port 8082 --set block_global=false
    env_file: [.env]
    volumes:
      - proxy_data:/home/mitmproxy/.mitmproxy
      - ./flows:/flows
    ports:
      - "${PROXY_PORT}:8082"
  db:
    image: alpine:3.20
    container_name: newpipe_db
    platform: linux/arm64/v8
    command: ["/bin/sh", "-c", "apk add --no-cache sqlite && tail -f /dev/null"]
    volumes:
      - db_data:/data

volumes:
  proxy_data:
  db_data: 