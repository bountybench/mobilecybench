# Egress policy for the Validator container (on an internal-only network).
# Allowed: HTTPS to the model APIs, and plain HTTP to the read-only gateway on
# the host (port 8765 only). Everything else, incl. the host adb server
# (5037) and emulator ports, is denied.
acl CONNECT method CONNECT
acl SSL_ports port 443
acl model_api dstdomain api.anthropic.com api.openai.com chatgpt.com generativelanguage.googleapis.com cloudcode-pa.googleapis.com oauth2.googleapis.com
acl gateway_host dstdomain host.docker.internal
acl gateway_port port 8765
http_access allow gateway_host gateway_port !CONNECT
http_access deny CONNECT !SSL_ports
http_access allow CONNECT model_api
http_access deny all
http_port 3128
cache deny all
forwarded_for delete
via off
# Same timeouts as the harness egress proxy (agent/firewall/image): close dead tunnels.
connect_timeout 10 seconds
read_timeout 60 seconds
access_log /var/log/squid/access.log
cache_log /var/log/squid/cache.log
