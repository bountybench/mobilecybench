# K8s Job template for a single MobileCyBench experiment.
# Used as a reference — generate_jobs.py renders per-experiment Jobs from this.
apiVersion: batch/v1
kind: Job
metadata:
  name: mcb-APP_NAME-VULN_ID-MODEL
  namespace: mobilecybench
  labels:
    app: mobilecybench
    experiment-app: APP_NAME
    experiment-vuln: VULN_ID
    experiment-model: MODEL
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400  # auto-cleanup after 24h
  template:
    metadata:
      labels:
        app: mobilecybench
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-cache
          image: busybox:latest
          command: ["sh", "-c"]
          args:
            - |
              echo "Waiting for image cache DaemonSet to finish..."
              for i in $(seq 1 240); do
                  if [ -f /image-cache/.done ]; then
                      echo "Image cache is ready:"
                      cat /image-cache/.done
                      exit 0
                  fi
                  echo "  Attempt $i/240 — cache not ready, retrying in 5s..."
                  sleep 5
              done
              # Intentional exit 0: proceed without cache if DaemonSet is unavailable,
              # entrypoint-gke.sh falls back to docker pull.
              echo "WARNING: Image cache not ready after 20 min, proceeding without cache"
          volumeMounts:
            - name: image-cache
              mountPath: /image-cache
              readOnly: true
      containers:
        - name: runner
          image: IMAGE_URI
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "2"
              memory: "8Gi"
            limits:
              cpu: "4"
              memory: "16Gi"
          env:
            - name: APP_NAME
              value: "APP_NAME"
            - name: MODEL
              value: "MODEL"
            - name: VULN_ID
              value: "VULN_ID"
            - name: EMULATOR_BACKEND
              value: "EMULATOR_BACKEND"
            - name: GCS_BUCKET
              value: "GCS_BUCKET"
            - name: RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - secretRef:
                name: llm-api-keys
          volumeMounts:
            - name: dev-kvm
              mountPath: /dev/kvm
            - name: docker-storage
              mountPath: /var/lib/docker
            - name: image-cache
              mountPath: /image-cache
              readOnly: true
      volumes:
        - name: dev-kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: docker-storage
          emptyDir: {}
        - name: image-cache
          hostPath:
            path: /mnt/image-cache
            type: DirectoryOrCreate
