# K8s Job template for a single MobileCyBench experiment.
# Used as a reference — generate_jobs.py renders per-experiment Jobs from this.
apiVersion: batch/v1
kind: Job
metadata:
  name: mcb-APP_NAME-VULN_ID-MODEL
  namespace: mobilecybench
  labels:
    app: mobilecybench
    experiment-app: APP_NAME
    experiment-vuln: VULN_ID
    experiment-model: MODEL
    experiment-workflow: WORKFLOW
    experiment-attacker: ATTACKER_MODEL
    experiment-no-codebase: NO_CODEBASE
spec:
  backoffLimit: 0  # no retry: a non-zero exit (incl. legit no_signal / deterministic harness fail) is final, not re-run
  ttlSecondsAfterFinished: 86400  # auto-cleanup after 24h
  template:
    metadata:
      labels:
        app: mobilecybench
    spec:
      restartPolicy: Never
      containers:
        - name: runner
          image: IMAGE_URI
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
            limits:
              cpu: "6"
              memory: "24Gi"
          env:
            - name: APP_NAME
              value: "APP_NAME"
            - name: MODEL
              value: "MODEL"
            - name: VULN_ID
              value: "VULN_ID"
            - name: EMULATOR_BACKEND
              value: "EMULATOR_BACKEND"
            - name: DRY_RUN
              value: "DRY_RUN"
            - name: GOLD_RUN
              value: "GOLD_RUN"
            - name: GCS_BUCKET
              value: "GCS_BUCKET"
            # External-agent / probe-only fields (empty in the legacy
            # synthetic-vuln path; build_runner_config.sh ignores empties).
            - name: AGENT_IMAGE
              value: "AGENT_IMAGE"
            - name: AGENT_MODE
              value: "AGENT_MODE"
            - name: WORKFLOW
              value: "WORKFLOW"
            - name: PROBE_ONLY
              value: "PROBE_ONLY"
            - name: ATTACKER_MODEL
              value: "ATTACKER_MODEL"
            - name: NO_CODEBASE
              value: "NO_CODEBASE"
            - name: AGENT_WALLCLOCK_SECONDS
              value: "AGENT_WALLCLOCK_SECONDS"
            - name: REASONING_EFFORT
              value: "REASONING_EFFORT"
            - name: ALLOW_UNREGISTERED_MODELS
              value: "ALLOW_UNREGISTERED_MODELS"
            - name: RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - secretRef:
                name: llm-api-keys
            - secretRef:
                name: dockerhub-credentials
                optional: true
            # claude-code (external agent mode) reads CLAUDE_CODE_OAUTH_TOKEN
            # + REFRESH_TOKEN from env. Optional so legacy synthetic-vuln +
            # non-claude-code agents still apply cleanly.
            - secretRef:
                name: claude-code-oauth
                optional: true
          volumeMounts:
            - name: dev-kvm
              mountPath: /dev/kvm
            - name: docker-storage
              mountPath: /var/lib/docker
      volumes:
        - name: dev-kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: docker-storage
          emptyDir: {}
