# K8s Job template for a single MobileCyBench experiment.
# Used as a reference — generate_jobs.py renders per-experiment Jobs from this.
apiVersion: batch/v1
kind: Job
metadata:
  name: mcb-APP_NAME-VULN_ID-MODEL
  namespace: mobilecybench
  labels:
    app: mobilecybench
    experiment-app: APP_NAME
    experiment-vuln: VULN_ID
    experiment-model: MODEL
    experiment-workflow: WORKFLOW
    experiment-attacker: ATTACKER_MODEL
    experiment-no-codebase: NO_CODEBASE
    experiment-multi-exploit: MULTI_EXPLOIT
spec:
  backoffLimit: BACKOFF_LIMIT
  ttlSecondsAfterFinished: TTL_SECONDS_AFTER_FINISHED
  template:
    metadata:
      labels:
        app: mobilecybench
    spec:
      restartPolicy: Never
      containers:
        - name: runner
          image: IMAGE_URI
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
            limits:
              cpu: "6"
              memory: "24Gi"
          env:
            - name: APP_NAME
              value: "APP_NAME"
            - name: MODEL
              value: "MODEL"
            - name: VULN_ID
              value: "VULN_ID"
            - name: EMULATOR_BACKEND
              value: "EMULATOR_BACKEND"
            - name: BUILD_TYPE
              value: "BUILD_TYPE"
            - name: NETWORK_MODE
              value: "NETWORK_MODE"
            - name: MOBILECYBENCH_EMULATOR_GPU
              value: "MOBILECYBENCH_EMULATOR_GPU"
            - name: DRY_RUN
              value: "DRY_RUN"
            - name: GOLD_RUN
              value: "GOLD_RUN"
            - name: GCS_BUCKET
              value: "GCS_BUCKET"
            # External-agent / probe-only fields (empty in the legacy
            # synthetic-vuln path; build_runner_config.sh ignores empties).
            - name: AGENT_IMAGE
              value: "AGENT_IMAGE"
            - name: AGENT_MODE
              value: "AGENT_MODE"
            - name: WORKFLOW
              value: "WORKFLOW"
            - name: PROBE_ONLY
              value: "PROBE_ONLY"
            - name: ATTACKER_MODEL
              value: "ATTACKER_MODEL"
            - name: NO_CODEBASE
              value: "NO_CODEBASE"
            - name: MULTI_EXPLOIT
              value: "MULTI_EXPLOIT"
            - name: AGENT_WALLCLOCK_SECONDS
              value: "AGENT_WALLCLOCK_SECONDS"
            - name: MAX_ITERATIONS
              value: "MAX_ITERATIONS"
            - name: REPLAY_EXPLOIT_DIR
              value: "REPLAY_EXPLOIT_DIR"
            - name: UPLOAD_FAILURE_HOLD_SECONDS
              value: "UPLOAD_FAILURE_HOLD_SECONDS"
            - name: RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - secretRef:
                name: llm-api-keys
            - secretRef:
                name: dockerhub-credentials
                optional: true
          volumeMounts:
            - name: dev-kvm
              mountPath: /dev/kvm
            - name: docker-storage
              mountPath: /var/lib/docker
      volumes:
        - name: dev-kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: docker-storage
          emptyDir: {}
