# K8s Job template for a single MobileCyBench experiment.
# Used as a reference — generate_jobs.py renders per-experiment Jobs from this.
apiVersion: batch/v1
kind: Job
metadata:
  name: mcb-APP_NAME-VULN_ID-MODEL
  namespace: mobilecybench
  labels:
    app: mobilecybench
    experiment-app: APP_NAME
    experiment-vuln: VULN_ID
    experiment-model: MODEL
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 86400  # auto-cleanup after 24h
  template:
    metadata:
      labels:
        app: mobilecybench
    spec:
      restartPolicy: Never
      containers:
        - name: runner
          image: IMAGE_URI
          securityContext:
            privileged: true
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
            limits:
              cpu: "6"
              memory: "24Gi"
          env:
            - name: APP_NAME
              value: "APP_NAME"
            - name: MODEL
              value: "MODEL"
            - name: VULN_ID
              value: "VULN_ID"
            - name: EMULATOR_BACKEND
              value: "EMULATOR_BACKEND"
            - name: DRY_RUN
              value: "DRY_RUN"
            - name: GOLD_RUN
              value: "GOLD_RUN"
            - name: GCS_BUCKET
              value: "GCS_BUCKET"
            - name: WORKFLOW
              value: "WORKFLOW"
            - name: PROBE_ONLY
              value: "PROBE_ONLY"
            - name: ATTACKER_MODEL
              value: "ATTACKER_MODEL"
            - name: BUILD_TYPE
              value: "BUILD_TYPE"
            - name: NO_CODEBASE
              value: "NO_CODEBASE"
            - name: APK_OBFUSCATION
              value: "APK_OBFUSCATION"
            - name: AGENT_MODE
              value: "AGENT_MODE"
            - name: AGENT_IMAGE
              value: "AGENT_IMAGE"
            - name: REASONING_EFFORT
              value: "REASONING_EFFORT"
            - name: MAX_ITERATIONS
              value: "MAX_ITERATIONS"
            - name: AGENT_WALLCLOCK_SECONDS
              value: "AGENT_WALLCLOCK_SECONDS"
            - name: ADDITIONAL_SYSTEM_PROMPT
              value: "ADDITIONAL_SYSTEM_PROMPT"
            - name: RUN_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            - secretRef:
                name: llm-api-keys
            - secretRef:
                name: dockerhub-credentials
                optional: true
          volumeMounts:
            - name: dev-kvm
              mountPath: /dev/kvm
            - name: docker-storage
              mountPath: /var/lib/docker
      volumes:
        - name: dev-kvm
          hostPath:
            path: /dev/kvm
            type: CharDevice
        - name: docker-storage
          emptyDir: {}
