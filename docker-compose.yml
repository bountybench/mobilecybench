services:
  account_db:
    image: postgres:16
    container_name: account_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flexisip
      POSTGRES_PASSWORD: flexipass
      POSTGRES_DB: flexisip_accounts
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexisip -d flexisip_accounts"]
      interval: 5s
      retries: 30
    networks:
      - private_net

  flexisip:
    image: leelai/flexisip:latest
    container_name: flexisip
    restart: unless-stopped
    volumes:
      - ./flexisip.conf:/etc/flexisip/flexisip.conf:ro
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
    depends_on:
      account_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "echo > /dev/tcp/localhost/5060 || exit 1"]
      interval: 5s
      retries: 30
    networks:
      - shared_net
      - private_net


  account_manager:
    build:
      context: ./
      dockerfile: account_manager
    image: php:8.2-apache
    container_name: account_manager
    restart: unless-stopped
    volumes:
      - ./flexiapi/flexiapi:/var/www/html
    working_dir: /var/www/html
    command: >
      sh -c "
        composer update
        composer install --no-dev --no-interaction --optimize-autoloader &&
        php artisan migrate --force &&
        apache2-foreground
      "
    environment:
      APP_ENV:
    depends_on:
      account_db:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - shared_net
      - private_net


networks:
  shared_net:
    external: true
  private_net:
