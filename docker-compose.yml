services:
  # Orchestrator Container
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: mobilecybench-backend
    privileged: true
    volumes:
      - dind-data:/var/lib/docker
      - ./:/mobilecybench
      - gradle-cache:/root/.gradle
      - ./logs:/mobilecybench/logs
      # Please uncomment the following lines if you need to mount SSH keys for the backend service
      # - ${HOME}/.ssh/id_rsa_mobilecybench-backend:/root/.ssh/id_rsa:ro
      # - ${HOME}/.ssh/id_rsa_mobilecybench-backend.pub:/root/.ssh/id_rsa.pub:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}
      - AZURE_OPENAI_API_KEY=${AZURE_OPENAI_API_KEY:-}
      - AZURE_OPENAI_ENDPOINT=${AZURE_OPENAI_ENDPOINT:-}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  dind-data:
    external: true
  gradle-cache: