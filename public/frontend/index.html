<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OpenAI Agent</title>
  <script defer src="app.js"></script>
  <link rel="stylesheet" href="style.css">
  <style>
    body { font-family: sans-serif; padding: 2rem; }
    #messages { white-space: pre-line; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1> MobileCyBench: Agent Vulnerability Detection</h1>
  
  <div class="center"> 

    <form id="startChatForm">
       <label for="apiKey">OpenAI API Key:
        <input type="password" id="apiKey" />
      </label>

      <br /><br />

      <label for="apps">Choose an app:
      <select name="apps" id="apps"> 
        <option value="none"> None </option>
        <option value="nextcloud-talk">NextCloud Talk</option>
      </select>
      </label>

      <br /><br />

      <label for="agent">Select an agent:
      <select name="agents" id="agents"> 
        <option value="gpt-4.1"> GPT 4.1 </option>
      </select>
      </label>

      <br /><br />

      <label class="switch"> Clone Codebase
        <input type="checkbox" id="cloneCheckbox" name="cloneCode">
        <span class="slider round"></span>
      </label>

      <br /><br />

      <label class="switch"> Critic Agent
        <input type="checkbox" id="criticCheckbox" name="criticAgent">
        <span class="slider round"></span>
      </label>
      
      <br /><br />

      <button type="submit">Start</button>
    </form>
    
    <br /><br />

    <div class="scrollbox"> 
      <div id="messages"></div>

      <br /><br />
      <textarea id="userInput" rows="3" cols="60" placeholder="Type your message..."> </textarea>
      <br />
      <button id="sendBtn">Send</button>
    </div>

    <button id="endBtn"> End </button>

  </div>

</body>
</html>
