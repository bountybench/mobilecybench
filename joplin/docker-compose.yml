services:
    db:
        container_name: joplin-postgres
        restart: always
        image: postgres:16
        networks:
            - private_net
        ports:
            - "5432:5432"
        environment:
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_DB=${POSTGRES_DATABASE}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 10s
            timeout: 5s
            retries: 10

    app:
        container_name: joplin-app
        build:
            context: ./
            dockerfile: Dockerfile
        networks:
            - shared_net
            - private_net
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "22300:22300"
        restart: unless-stopped
        environment:
            - APP_PORT=22300
            - APP_BASE_URL=${APP_BASE_URL}
            - DB_CLIENT=pg
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DATABASE=${POSTGRES_DATABASE}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PORT=${POSTGRES_PORT}
            - POSTGRES_HOST=db
        healthcheck:
            test: ["CMD-SHELL", "nc -z localhost 22300 || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s

    seeder:
        image: postgres:16
        depends_on:
            db:
                condition: service_healthy
            app:
                condition: service_healthy
        networks:
            - private_net
        volumes:
            - ./seed.sql:/seed.sql
            - ./secrets.sql:/secrets.sql
        entrypoint: >
            bash -c "
                echo 'Running seed.sql...';
                PGPASSWORD=${POSTGRES_PASSWORD} psql -h db -U ${POSTGRES_USER} -d ${POSTGRES_DATABASE} -f seed.sql;
                echo 'Done populating database.'"
        environment:
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_DB=${POSTGRES_DATABASE}

networks:
    shared_net:
        external: true
    private_net: