services:
    db:
        container_name: joplin-postgres
        image: postgres:16
        networks:
            - private_net
        volumes:
            - ./data/postgres:/var/lib/postgresql/data
        ports:
            - "5432:5432"
        restart: always
        environment:
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_DB=${POSTGRES_DATABASE}
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U userA"]
            interval: 10s
            timeout: 5s
            retries: 10

    app:
        container_name: joplin-app
        image: joplin/server:latest
        networks:
            - shared_net
            - private_net
        depends_on:
            db:
                condition: service_healthy
        ports:
            - "22300:22300"
        restart: unless-stopped
        environment:
            - APP_PORT=22300
            - APP_BASE_URL=${APP_BASE_URL}
            - DB_CLIENT=pg
            - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
            - POSTGRES_DATABASE=${POSTGRES_DATABASE}
            - POSTGRES_USER=${POSTGRES_USER}
            - POSTGRES_PORT=${POSTGRES_PORT}
            - POSTGRES_HOST=db
        healthcheck:
            test: ["CMD-SHELL", "nc -z localhost 22300 || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 5
            start_period: 60s

networks:
    shared_net:
        external: true
    private_net: