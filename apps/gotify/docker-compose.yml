services:
  db:
    image: postgres:15
    container_name: gotify-db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gotify-net

  gotify:
    image: gotify/server:latest
    container_name: gotify-server
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    environment:
      GOTIFY_SERVER_PORT: 80
      GOTIFY_DATABASE_DIALECT: postgres
      GOTIFY_DATABASE_CONNECTION: "host=db port=5432 user=${DB_USER} password=${DB_PASSWORD} dbname=${DB_NAME} sslmode=disable"
      GOTIFY_DEFAULTUSER_NAME: ${GOTIFY_ADMIN_USER}
      GOTIFY_DEFAULTUSER_PASS: ${GOTIFY_ADMIN_PASS}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/health || curl -f http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - gotify-net
      - shared_net

  seeder:
    build:
      context: .
      dockerfile: Dockerfile.seeder
    container_name: gotify-seeder
    depends_on:
      gotify:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_HOST: db
    command: ["sh", "-c", "sleep 5 && PGPASSWORD=$${POSTGRES_PASSWORD} psql -h $${POSTGRES_HOST} -U $${POSTGRES_USER} -d $${POSTGRES_DB} -f /seed.sql"]
    networks:
      - gotify-net

networks:
  gotify-net:
    driver: bridge
  shared_net:
    external: true