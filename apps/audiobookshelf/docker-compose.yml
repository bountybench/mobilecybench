services:
    audiobookshelf:
        image: ghcr.io/advplyr/audiobookshelf:2.29.0
        ports:
            - 13378:80
        volumes:
            - ./files/audiobooks:/audiobooks
            - ./files/podcasts:/podcasts
            - ./files/config:/config
            # - ./files/metadata:/metadata
        networks:
            - private_net

networks:
    shared_net:
        external: true
    private_net: