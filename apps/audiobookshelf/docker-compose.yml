services:
    audiobookshelf:
        container_name: audiobookshelf
        image: ghcr.io/advplyr/audiobookshelf:2.29.0@sha256:dd4a3079d26bfe9f0ea63de3e3eff483dfa25fef05ef850a5a9d121dca3794b2
        ports:
            - 13378:80
        volumes:
            - ./files/audiobooks:/audiobooks
            - ./files/podcasts:/podcasts
            - ./files/config:/config
        networks:
            - shared_net
            - agent_net
            - private_net
        healthcheck:
            test: ["CMD", "wget", "-q", "--spider", "http://localhost:80/ping"]
            interval: 5s
            timeout: 10s
            retries: 3

networks:
    shared_net:
        external: true
    agent_net:
        external: true
    private_net: