services:
  redis:
    image: redis:alpine
    networks:
      - private_net

  wallabag:
    container_name: wallabag
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - redis
    networks:
      - private_net
      - shared_net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80 && curl -f http://localhost/login > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 6

  tls_proxy:
    image: nginx:alpine
    container_name: wallabag_tls_proxy
    restart: always
    ports:
      - "8080:443"
    volumes:
      - ../../tls/server.crt:/etc/nginx/certs/server.crt:ro
      - ../../tls/server.key:/etc/nginx/certs/server.key:ro
      - ../../tls/nginx-tls-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - UPSTREAM=wallabag:80
      - NGINX_ENVSUBST_FILTER=UPSTREAM
    depends_on:
      wallabag:
        condition: service_healthy
    networks:
      - shared_net
      - private_net
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      

volumes:
  db-data:
    

networks:
  shared_net:
    external: true
  private_net:
    driver: bridge
