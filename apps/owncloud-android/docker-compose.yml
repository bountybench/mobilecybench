volumes:
  files:
    driver: local
  mysql:
    driver: local
  redis:
    driver: local

services:
  tls_proxy:
    image: nginx:1.31.2-alpine@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    container_name: owncloud_tls_proxy
    restart: always
    ports:
      - 8080:443
    volumes:
      - ../../tls/server.crt:/etc/nginx/certs/server.crt:ro
      - ../../tls/server.key:/etc/nginx/certs/server.key:ro
      - ../../tls/nginx-tls-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - UPSTREAM=owncloud_server:8080
      - NGINX_ENVSUBST_FILTER=UPSTREAM
    depends_on:
      owncloud:
        condition: service_healthy
    networks:
      - shared_net
      - agent_net
      - private_net
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost/status.php"]
      interval: 10s
      timeout: 5s
      retries: 5

  owncloud:
    image: owncloud/server:10.11.0@sha256:8fbd1640f61f22dbad751236759ae279634126686272f1b082988e54a2df41f2
    container_name: owncloud_server
    restart: always
    depends_on:
      - mariadb
      - redis
    env_file:
      - .env
    environment:
      - OWNCLOUD_DOMAIN=${OWNCLOUD_DOMAIN}
      - OWNCLOUD_TRUSTED_DOMAINS=${OWNCLOUD_TRUSTED_DOMAINS}
      - OWNCLOUD_DB_TYPE=${OWNCLOUD_DB_TYPE}
      - OWNCLOUD_DB_HOST=mariadb  # override / private net
      - OWNCLOUD_DB_NAME=${OWNCLOUD_DB_NAME}
      - OWNCLOUD_DB_USERNAME=${OWNCLOUD_DB_USERNAME}
      - OWNCLOUD_DB_PASSWORD=${OWNCLOUD_DB_PASSWORD}
      - OWNCLOUD_ADMIN_USERNAME=${OWNCLOUD_ADMIN_USERNAME}
      - OWNCLOUD_ADMIN_PASSWORD=${OWNCLOUD_ADMIN_PASSWORD}
      - OWNCLOUD_REDIS_ENABLED=${OWNCLOUD_REDIS_ENABLED}
      - OWNCLOUD_REDIS_HOST=${OWNCLOUD_REDIS_HOST}
    volumes:
      - files:/mnt/data
      - ./empty_skeleton:/var/www/owncloud/core/skeleton  # overwrite to not include default folders/files
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 5

  mariadb:
    image: mariadb:10.5@sha256:a530aeeefd82f4fa5150f391b6c75462140904780338766f6b03acecb1cca3ce
    container_name: owncloud_mariadb
    restart: always
    env_file:
      - .env
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
    volumes:
      - mysql:/var/lib/mysql
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:6@sha256:da7091440b2b4d9456603be812dba895cd75bedd66564d7f01f1f010521f8467
    container_name: owncloud_redis
    restart: always
    volumes:
      - redis:/data
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  shared_net:
    external: true
  agent_net:
    external: true
  private_net:
