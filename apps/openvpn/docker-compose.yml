version: '3.8'

services:
  openvpn-server:
    build:
      context: .
      dockerfile: Dockerfile.openvpn-server
    image: openvpn-cve-server:latest
    container_name: openvpn-server
    command: /usr/local/bin/start-openvpn.sh
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "1194:1194/tcp"
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      - shared_net
    restart: unless-stopped

networks:
  shared_net:
    external: true