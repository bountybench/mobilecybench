version: '3.8'

services:
  openvpn-server:
    image: openvpn-cve-server:latest
    container_name: openvpn-server
    command: /usr/local/bin/start-openvpn.sh
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "1194:1194/udp"
      - "8080:8080"
    volumes:
      - openvpn-data:/etc/openvpn
    networks:
      - shared_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pgrep openvpn || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  openvpn-data:

networks:
  shared_net:
    external: true