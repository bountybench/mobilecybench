services:
  mesh-alice:
    image: meshtastic/device-simulator:latest
    container_name: mesh-alice
    environment:
      - HWID=2882400001
      - PORT=4403
      - HWMODEL=RAK4631
    ports:
      - "4403:4403"
    networks:
      - shared_net
      - private_net
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep -q meshtasticd"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  mesh-bob:
    image: meshtastic/device-simulator:latest
    container_name: mesh-bob
    environment:
      - HWID=2882400002
      - PORT=4404
      - HWMODEL=RAK4631
    ports:
      - "4404:4404"
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep -q meshtasticd"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

  mesh-eve:
    image: meshtastic/device-simulator:latest
    container_name: mesh-eve
    environment:
      - HWID=2882400003
      - PORT=4405
      - HWMODEL=RAK4631
    ports:
      - "4405:4405"
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "sh", "-c", "ps aux | grep -q meshtasticd"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  shared_net:
    external: true
  private_net:
    driver: bridge
