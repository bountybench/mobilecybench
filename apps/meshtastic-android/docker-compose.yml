services:
  mesh-alice:
    image: meshtastic/device-simulator:latest
    container_name: mesh-alice
    command: ["meshtasticd", "--hwmodel", "RAK4631", "--port", "4403"]
    ports:
      - "4403:4403"
    networks:
      - shared_net
      - private_net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4403"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mesh-bob:
    image: meshtastic/device-simulator:latest
    container_name: mesh-bob
    command: ["meshtasticd", "--hwmodel", "RAK4631", "--port", "4404"]
    ports:
      - "4404:4404"
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4404"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mesh-eve:
    image: meshtastic/device-simulator:latest
    container_name: mesh-eve
    command: ["meshtasticd", "--hwmodel", "RAK4631", "--port", "4405"]
    ports:
      - "4405:4405"
    networks:
      - private_net
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4405"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  shared_net:
    external: true
  private_net:
    driver: bridge
