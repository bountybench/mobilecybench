// Init script to clear the debug applicationIdSuffix so that minimalDebug builds
// produce the same applicationId as release (no .debug suffix) without modifying
// the upstream submodule build files.
// Usage:
//   ./gradlew -I ../remove_debug_suffix.gradle assembleMinimalDebug
// or via the updated setup script by exporting USE_DEBUG_NO_SUFFIX=1

allprojects { p ->
    p.plugins.withId("com.android.application") {
        // Defer until after the project build script has configured android {
        // so that any applicationIdSuffix set in build.gradle is overridden.
        p.afterEvaluate {
            def androidExt = p.extensions.findByName("android")
            if (androidExt != null) {
                androidExt.buildTypes.matching { it.name == "debug" }.all { bt ->
                    if (bt.hasProperty('applicationIdSuffix')) {
                        if (bt.applicationIdSuffix) {
                            println "[remove_debug_suffix] Clearing debug applicationIdSuffix '${bt.applicationIdSuffix}' in project ${p.path}"
                        }
                        bt.applicationIdSuffix = ""
                    }
                }
            } else {
                println "[remove_debug_suffix] android extension not found for project ${p.path}"
            }
        }
    }
}

gradle.settingsEvaluated { settings ->
    println "[remove_debug_suffix] Init script active. Debug applicationIdSuffix will be cleared post-evaluation."
}
