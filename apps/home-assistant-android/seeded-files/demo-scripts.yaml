# Sentinel script seeded at start_runtime time. Probes diff
# baseline_manifest.json["expected_script_entities"] against /api/states for
# `script.*` entities.
sentinel_lights_off:
  alias: Sentinel Lights Off
  description: Probe sentinel — turns off all lights.
  sequence:
    - service: light.turn_off
      target:
        entity_id: all
  mode: single
