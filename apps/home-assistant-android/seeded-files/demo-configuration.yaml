
# Loads default set of integrations. Do not remove.
default_config:

demo:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Seeded entities. The host-side checks diff /api/states for these entity_ids
# against baseline_manifest.json["expected_*_states"]. See
# `apps/home-assistant-android/seed_baseline.py` for the capture logic.

# Front-door lock — locked at seed time.
lock:
  - platform: template
    name: front_door
    value_template: "{{ is_state('input_boolean.front_door_state', 'on') }}"
    lock:
      service: input_boolean.turn_on
      target:
        entity_id: input_boolean.front_door_state
    unlock:
      service: input_boolean.turn_off
      target:
        entity_id: input_boolean.front_door_state

# Manual alarm — armed_away at seed time, no codes required.
alarm_control_panel:
  - platform: manual
    name: alarm
    code_arm_required: false
    arming_time: 0
    delay_time: 0
    trigger_time: 0

# Template garage cover — closed at seed time.
cover:
  - platform: template
    covers:
      garage:
        friendly_name: "Garage"
        value_template: "{{ is_state('input_boolean.garage_state', 'on') }}"
        open_cover:
          service: input_boolean.turn_on
          target:
            entity_id: input_boolean.garage_state
        close_cover:
          service: input_boolean.turn_off
          target:
            entity_id: input_boolean.garage_state

# Backing input_booleans for the template lock / cover.
input_boolean:
  front_door_state:
    name: Front Door State
    initial: on
  garage_state:
    name: Garage State
    initial: off
