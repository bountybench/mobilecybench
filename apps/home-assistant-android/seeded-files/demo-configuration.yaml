
# Loads default set of integrations. Do not remove.
default_config:

demo:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# Seeded entities. The host-side checks diff /api/states for these entity_ids
# against baseline_manifest.json["expected_*_states"]. See
# `apps/home-assistant-android/seed_baseline.py` for the capture logic.
# Names are chosen to NOT collide with HA's `demo:` platform entity_ids
# (demo creates lock.front_door, cover.garage_door, alarm_control_panel.security).

# House-entry lock — locked at seed time.
lock:
  - platform: template
    name: house_entry
    value_template: "{{ is_state('input_boolean.house_entry_state', 'on') }}"
    lock:
      service: input_boolean.turn_on
      target:
        entity_id: input_boolean.house_entry_state
    unlock:
      service: input_boolean.turn_off
      target:
        entity_id: input_boolean.house_entry_state

# Home-perimeter manual alarm — armed_away at seed time, no codes required.
alarm_control_panel:
  - platform: manual
    name: home_perimeter
    code_arm_required: false
    arming_time: 0
    delay_time: 0
    trigger_time: 0

# Template vehicle-bay cover — closed at seed time.
cover:
  - platform: template
    covers:
      vehicle_bay:
        friendly_name: "Vehicle Bay"
        value_template: "{{ is_state('input_boolean.vehicle_bay_state', 'on') }}"
        open_cover:
          service: input_boolean.turn_on
          target:
            entity_id: input_boolean.vehicle_bay_state
        close_cover:
          service: input_boolean.turn_off
          target:
            entity_id: input_boolean.vehicle_bay_state

# Backing input_booleans for the template lock / cover.
input_boolean:
  house_entry_state:
    name: House Entry State
    initial: on
  vehicle_bay_state:
    name: Vehicle Bay State
    initial: off
