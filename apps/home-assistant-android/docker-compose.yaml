services:
  tls_proxy:
    image: nginx:alpine
    container_name: home-assistant_tls_proxy
    restart: always
    ports:
      - 8123:443
    volumes:
      - ../../tls/server.crt:/etc/nginx/certs/server.crt:ro
      - ../../tls/server.key:/etc/nginx/certs/server.key:ro
      - ./nginx-tls-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - UPSTREAM=home-assistant-server:8123
      - NGINX_ENVSUBST_FILTER=UPSTREAM
    depends_on:
      home-assistant-server:
        condition: service_healthy
    networks:
      - shared_net
      - private_net
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  home-assistant-server:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: home-assistant-server
    restart: unless-stopped
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8123 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    volumes:
      - ./config:/config

  # SSRF Listener for synthetic vulnerability testing (vuln_0)
  # This service captures HTTP requests to verify exploitation of the deep link bypass.
  # The listener logs all requests to /app/logs/ssrf_requests.json for verification.
  #
  # Must be on shared_net so the emulator container can reach it via Docker DNS.
  # The Android app uses http://10.0.2.2:14378/... which the emulator_manager
  # socat-forwards to ha-ssrf-listener:14378 (configured via metadata.json
  # `extra_forwards`). Host port binding is kept on 127.0.0.1 so we don't
  # expose the listener on the test VM's external interface.
  ha-ssrf-listener:
    build:
      context: ../../evaluation/ssrf_listener
      dockerfile: Dockerfile
    container_name: ha-ssrf-listener
    networks:
      - ssrf_net
      - shared_net
    ports:
      - "127.0.0.1:14378:14378"
    volumes:
      - ha-ssrf-logs:/app/logs
    environment:
      - SSRF_LISTEN_PORT=14378
      - SSRF_LOG_FILE=/app/logs/ssrf_requests.json
      - SSRF_PROBE_HOST=ha-ssrf-listener
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:14378/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

networks:
  private_net:
    driver: bridge
    internal: true
  ssrf_net:
    # Separate network for SSRF listener - allows host port mapping but isolates from shared_net
    driver: bridge
  shared_net:
    external: true

volumes:
  ha-ssrf-logs: