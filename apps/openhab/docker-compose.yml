version: "3.8"
services:
  openhab:
    image: "openhab/openhab:3.4.2"
    container_name: openhab
    restart: unless-stopped
    ports:
      - "8080:8080"   # HTTP
      - "8443:8443"   # HTTPS (openHAB)
      - "8101:8101"   # Karaf console
      - "5007:5007"   # LSP for rules (optional)
    volumes:
      - ./openhab_addons:/openhab/addons
      - ./openhab_conf:/openhab/conf
      - ./openhab_userdata:/openhab/userdata
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    environment:
      - USER_ID=${USER_ID}
      - GROUP_ID=${GROUP_ID}
      - OPENHAB_HTTP_PORT=8080
      - OPENHAB_HTTPS_PORT=8443
      # CRYPTO_POLICY=unlimited  # enable only if you need bindings that require it and you understand legal/licensing implications
      - EXTRA_JAVA_OPTS=-Duser.timezone=America/Los_Angeles
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    networks:
      - openhab_net
      - shared_net

  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_pub -h localhost -t healthcheck -m ping -q 1 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - openhab_net

networks:
  openhab_net:
    driver: bridge
  shared_net:
    external: true

