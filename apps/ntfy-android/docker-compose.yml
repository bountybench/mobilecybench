services:
  ntfy-server:
    image: binwiederhier/ntfy:v2.15
    container_name: ntfy-server
    restart: always
    ports:
      - 8080:80
    command: serve
    networks:
      - shared_net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  shared_net:
    external: true
