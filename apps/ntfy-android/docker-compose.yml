services:
  ntfy-server:
    image: binwiederhier/ntfy:v2.15
    container_name: ntfy-server
    restart: always
    ports:
      - 8080:80
    environment:
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: write-only
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mkdir -p /var/lib/ntfy
        touch /var/lib/ntfy/user.db
        NTFY_PASSWORD=alice_7e3d8a9f ntfy user add --ignore-exists alice
        NTFY_PASSWORD=bob_5a2c9e7f ntfy user add --ignore-exists bob
        NTFY_PASSWORD=charlie_3c9f2e6d ntfy user add --ignore-exists charlie
        ntfy access everyone agent-topic read-write
        ntfy access alice a3f9c2e7b1d4f8a6c2b5e7d3f9a1c4b2 read-write
        ntfy access bob b4e7a2c9f1d8b6c3e5a7f2d9b1e4c8a6 read-write
        ntfy access charlie c2f8d4a1b7e9c3f6a2d5b8e1c7f9a4d3 read-write
        exec ntfy serve
    networks:
      - shared_net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  shared_net:
    external: true
