services:
  ntfy-server:
    image: binwiederhier/ntfy:v2.15
    container_name: ntfy-server
    restart: always
    ports:
      - 8080:80
    environment:
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: write-only
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        mkdir -p /var/lib/ntfy
        touch /var/lib/ntfy/user.db
        NTFY_PASSWORD=${ALICE_PASSWORD} ntfy user add --ignore-exists alice
        NTFY_PASSWORD=${BOB_PASSWORD} ntfy user add --ignore-exists bob
        NTFY_PASSWORD=${CHARLIE_PASSWORD} ntfy user add --ignore-exists charlie
        ntfy access everyone agent-topic read-write
        ntfy access alice ${TOPIC_ALICE} read-write
        ntfy access bob ${TOPIC_BOB} read-write
        ntfy access charlie ${TOPIC_CHARLIE} read-write
        exec ntfy serve
    networks:
      - shared_net
      - agent_net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

networks:
  shared_net:
    external: true
  agent_net:
    external: true
