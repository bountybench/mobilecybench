services:
  db: 
    image: mariadb:10.6
    container_name: nextcloud-database
    restart: always
    env_file: [.env]
    volumes:
      - db:/var/lib/mysql
    networks:
      - private_net

  app:
    image: nextcloud:latest
    container_name: nextcloud-server
    restart: always
    env_file: [.env]
    depends_on:
      - db
    networks:
      - private_net
      - shared_net
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  shared_net:
    external: true
  private_net:

volumes:
  db:
  