volumes:
  postgres_data:
    driver: local
  pictrs_data:
    driver: local

services:
  tls_proxy:
    image: nginx:1.31.2-alpine@sha256:54f2a904c251d5a34adf545a72d32515a15e08418dae0266e23be2e18c66fefa
    container_name: jerboa_tls_proxy
    restart: always
    ports:
      - 8536:443
    volumes:
      - ../../tls/server.crt:/etc/nginx/certs/server.crt:ro
      - ../../tls/server.key:/etc/nginx/certs/server.key:ro
      - ../../tls/nginx-tls-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - UPSTREAM=lemmy:8536
      - NGINX_ENVSUBST_FILTER=UPSTREAM
    depends_on:
      lemmy:
        condition: service_healthy
    networks:
      - shared_net
      - agent_net
      - private_net
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  lemmy:
    image: dessalines/lemmy:0.19.3@sha256:39189c3ebac9201a9f1e07fc03d6c0d919749785436dd72d02c1dd25f5f48ab0
    container_name: lemmy_server
    hostname: lemmy
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      pictrs:
        condition: service_started
    environment:
      - RUST_LOG=warn
      - LEMMY_DATABASE_URL=postgres://lemmy:password@postgres:5432/lemmy
    volumes:
      - ./lemmy.hjson:/config/config.hjson:ro
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "grep -q '00000000:2158' /proc/net/tcp || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine@sha256:e013e867e712fec275706a6c51c966f0bb0c93cfa8f51000f85a15f9865a28cb
    container_name: lemmy_postgres
    hostname: postgres
    restart: always
    environment:
      - POSTGRES_USER=lemmy
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=lemmy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemmy"]
      interval: 10s
      timeout: 5s
      retries: 5

  pictrs:
    image: asonix/pictrs:0.5.16@sha256:b5a11e26ee8b3e6e7fa2cb4ce0afc8a8fc56e33801ba40edcf5212a1818c42f9
    container_name: lemmy_pictrs
    hostname: pictrs
    restart: always
    environment:
      - PICTRS__SERVER__API_KEY=API_KEY
      - RUST_LOG=warn
      - PICTRS__MEDIA__VIDEO_CODEC=vp9
      - PICTRS__MEDIA__GIF__MAX_WIDTH=256
      - PICTRS__MEDIA__GIF__MAX_HEIGHT=256
      - PICTRS__MEDIA__GIF__MAX_AREA=65536
      - PICTRS__MEDIA__GIF__MAX_FRAME_COUNT=400
    volumes:
      - pictrs_data:/mnt
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "[ -d /proc/1 ]"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  shared_net:
    external: true
  agent_net:
    external: true
  private_net:
