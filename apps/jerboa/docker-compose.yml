volumes:
  postgres_data:
    driver: local
  pictrs_data:
    driver: local

services:
  tls_proxy:
    image: nginx:alpine
    container_name: jerboa_tls_proxy
    restart: always
    ports:
      - 8536:443
    volumes:
      - ../../tls/server.crt:/etc/nginx/certs/server.crt:ro
      - ../../tls/server.key:/etc/nginx/certs/server.key:ro
      - ../../tls/nginx-tls-proxy.conf.template:/etc/nginx/templates/default.conf.template:ro
    environment:
      - UPSTREAM=lemmy:8536
      - NGINX_ENVSUBST_FILTER=UPSTREAM
    depends_on:
      lemmy:
        condition: service_healthy
    networks:
      - shared_net
      - private_net
    healthcheck:
      test: ["CMD", "curl", "-fsk", "https://localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  lemmy:
    image: dessalines/lemmy:0.19.3
    container_name: lemmy_server
    hostname: lemmy
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      pictrs:
        condition: service_started
    environment:
      - RUST_LOG=warn
      - LEMMY_DATABASE_URL=postgres://lemmy:password@postgres:5432/lemmy
    volumes:
      - ./lemmy.hjson:/config/config.hjson:ro
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8536/api/v3/site >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    container_name: lemmy_postgres
    hostname: postgres
    restart: always
    environment:
      - POSTGRES_USER=lemmy
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=lemmy
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lemmy"]
      interval: 10s
      timeout: 5s
      retries: 5

  pictrs:
    image: asonix/pictrs:0.5.16
    container_name: lemmy_pictrs
    hostname: pictrs
    restart: always
    environment:
      - PICTRS__SERVER__API_KEY=API_KEY
      - RUST_LOG=warn
      - PICTRS__MEDIA__VIDEO_CODEC=vp9
      - PICTRS__MEDIA__GIF__MAX_WIDTH=256
      - PICTRS__MEDIA__GIF__MAX_HEIGHT=256
      - PICTRS__MEDIA__GIF__MAX_AREA=65536
      - PICTRS__MEDIA__GIF__MAX_FRAME_COUNT=400
    volumes:
      - pictrs_data:/mnt
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "[ -d /proc/1 ]"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  shared_net:
    external: true
  private_net:
