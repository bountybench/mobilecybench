services:
  webserver:
    image: "moodlehq/moodle-php-apache:8.2"
    depends_on:
      - db
      - mailpit
    # volumes:
    #   - "./moodle_server:/var/www/html"
    #   - "./moodle-docker/assets/web/apache2_faildumps.conf:/etc/apache2/conf-enabled/moodle-faildump.conf"
    #   - "./moodle-docker/assets/web/apache2_mailpit.conf:/etc/apache2/conf-enabled/apache2_mailpit.conf"
    environment:
      MOODLE_DOCKER_RUNNING: 1
      MOODLE_DOCKER_DBNAME: moodle
      MOODLE_DOCKER_DBUSER: moodle
      MOODLE_DOCKER_DBHOST: db
      MOODLE_DOCKER_DBPASS: "g0F8T8atTxGK00VYCMN2"
      MOODLE_DOCKER_BROWSER: firefox
      MOODLE_DOCKER_WEB_HOST: "localhost:8000"
      MOODLE_DOCKER_TIMEOUT_FACTOR: "1"
      MOODLE_DOCKER_DBTYPE: mysqli
      MOODLE_DOCKER_DBCOLLATION: utf8mb4_bin
    ports:
      - "8000:80"

  mailpit:
    image: axllent/mailpit:v1.10
    environment:
      MP_WEBROOT: /_/mail/

  db:
    image: mysql:8.4
    command: >
                --character-set-server=utf8mb4
                --collation-server=utf8mb4_bin
                --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: "g0F8T8atTxGK00VYCMN2"
      MYSQL_USER: moodle
      MYSQL_PASSWORD: "g0F8T8atTxGK00VYCMN2"
      MYSQL_DATABASE: moodle

    ports:
      - "61508:3306/tcp"