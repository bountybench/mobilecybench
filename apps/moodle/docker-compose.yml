networks:
  shared_net:
    external: true
  agent_net:
    external: true
  private_net:

services:
  webserver:
    image: "moodlehq/moodle-php-apache:8.2@sha256:511ad7e007ef145cee6516c8aa6f263c837308b42472e5d2d2ef35a3ffe67516"
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    environment:
      MOODLE_DOCKER_RUNNING: 1
      MOODLE_DOCKER_DBNAME: moodle
      MOODLE_DOCKER_DBUSER: moodle
      MOODLE_DOCKER_DBHOST: db
      MOODLE_DOCKER_DBPASS: "g0F8T8atTxGK00VYCMN2"
      MOODLE_DOCKER_BROWSER: firefox
      MOODLE_DOCKER_WEB_HOST: "localhost:8000"
      MOODLE_DOCKER_TIMEOUT_FACTOR: "1"
      MOODLE_DOCKER_DBTYPE: mysqli
      MOODLE_DOCKER_DBCOLLATION: utf8mb4_bin
    ports:
      - "8000:80"
    networks:
      - shared_net
      - private_net
      - agent_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  mailpit:
    image: axllent/mailpit:v1.10@sha256:105bcbd657cc2af01132504d74849545e6e778a4e79990c0f1e6f58455369394
    environment:
      MP_WEBROOT: /_/mail/
    networks:
      - private_net

  db:
    image: mysql:8.4@sha256:d36d39a64cd12a5c1cc9e6aa2bfb5f8d4c81a2f6586e0a04a9ae13939db02209
    command: >
                --character-set-server=utf8mb4
                --collation-server=utf8mb4_bin
                --skip-log-bin
    environment:
      MYSQL_ROOT_PASSWORD: "g0F8T8atTxGK00VYCMN2"
      MYSQL_USER: moodle
      MYSQL_PASSWORD: "g0F8T8atTxGK00VYCMN2"
      MYSQL_DATABASE: moodle

    networks:
      - private_net

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pg0F8T8atTxGK00VYCMN2"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
