# SimpleX SMP server configuration
# Default configuration for development/testing

[STORE_LOG]
log_stats = on

[AUTH]
# Enable basic authentication
new_queues = on

[TRANSPORT]
port = 5223
log_tls_errors = off

[INACTIVE_CLIENTS]
disconnect = off

[WS]
port = 5224
path = /
host_header = localhost:5224

[CONTROL_PORT]
port = 5225