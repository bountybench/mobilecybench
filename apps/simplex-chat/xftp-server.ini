# SimpleX XFTP server configuration
# Default configuration for development/testing

[STORE_LOG]
log_stats = on

[AUTH]
# Enable basic authentication
new_files = on

[TRANSPORT]
port = 5443
log_tls_errors = off

[FILES]
# File storage settings
path = /opt/simplex/xftp/files
quota = 1gb
ttl = 48h

[INACTIVE_CLIENTS]
disconnect = off

[CONTROL_PORT]
port = 5444