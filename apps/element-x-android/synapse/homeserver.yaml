# Configuration file for Synapse.
#
# This is a YAML file: see [1] for a quick introduction. Note in particular
# that *indentation is important*: all the elements of a list or dictionary
# should have the same indentation.
#
# [1] https://docs.ansible.com/ansible/latest/reference_appendices/YAMLSyntax.html
#
# For more information on how to configure Synapse, including a complete accounting of
# each option, go to docs/usage/configuration/config_documentation.md or
# https://element-hq.github.io/synapse/latest/usage/configuration/config_documentation.html
server_name: "localhost"
pid_file: /data/homeserver.pid
listeners:
  - port: 8008
    tls: false
    type: http
    x_forwarded: true
    resources:
      - names: [client, federation]
        compress: false
database:
  name: psycopg2
  args:
    user: synapse
    password: synapse_password
    database: synapse
    host: matrix-postgres
    port: 5432
    cp_min: 5
    cp_max: 10
log_config: "/data/localhost.log.config"
media_store_path: /data/media_store
registration_shared_secret: "=Qs&~EuuWH4812mBFS4.eyL7QrPDmQy95pqfrwZ9wLaX3g+Iv3"
report_stats: false

# Enable registration for testing
enable_registration: true
enable_registration_without_verification: true

# Disable rate limiting for testing environment
rc_login:
  per_second: 10000
  burst_count: 10000

rc_registration:
  per_second: 10000
  burst_count: 10000

rc_admin_redaction:
  per_second: 10000
  burst_count: 10000

rc_message:
  per_second: 10000
  burst_count: 10000

rc_joins:
  local:
    per_second: 10000
    burst_count: 10000
  remote:
    per_second: 10000
    burst_count: 10000

rc_3pid_validation:
  per_second: 10000
  burst_count: 10000

rc_invites:
  per_room:
    per_second: 10000
    burst_count: 10000
  per_user:
    per_second: 10000
    burst_count: 10000

# Additional settings for testing
suppress_key_server_warning: true
enable_registration_captcha: false
recaptcha_public_key: ""
recaptcha_private_key: ""
macaroon_secret_key: "--3JJ6ol-pVqUqk*-6ujIkO2mgf:+BnYcaLRurvhg:#5OlHVci"
form_secret: "&Smsz3wQdk:t,KwcU8=_YW+cjI:*N&9V,_tX.wKu91#cl#pAWE"
signing_key_path: "/data/localhost.signing.key"
trusted_key_servers:
  - server_name: "matrix.org"


