services:
  db:
    container_name: simplelogin-db
    image: postgres:13
    environment:
      POSTGRES_DB: simplelogin
      POSTGRES_USER: simplelogin
      POSTGRES_PASSWORD: password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simplelogin -d simplelogin"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - private_net

  simplelogin-api:
    container_name: simplelogin-api
    image: simplelogin/app:3.4.0
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Use the config file inside the container
      CONFIG: /code/simplelogin.env
      # Minimal overrides (DB connection)
      DB_URI: postgresql://simplelogin:password@db:5432/simplelogin
      # Server binding configuration
      FLASK_RUN_HOST: 0.0.0.0
      FLASK_RUN_PORT: 7777
      # Registration control (remove DISABLE_REGISTRATION to enable it)
      # DISABLE_EMAIL_VERIFICATION not used in this version
      
    ports:
      - "7777:7777"
    volumes:
      # Provide a real config file from the repo
      - ./config/simplelogin.env:/code/simplelogin.env:ro
      - simplelogin_data:/app/static/upload
    networks:
      - private_net
      - shared_net
    command: >
      sh -c "
        echo 'dummy-dkim-private-key' > /tmp/dummy_dkim_private.key &&
        echo 'dummy-dkim-public-key' > /tmp/dummy_dkim_public.key &&
        echo 'dummy-paddle-key' > /tmp/dummy_paddle.key &&
        flask db upgrade &&
        python init_app.py &&
        sed -i 's/app.run(debug=True, port=7777)/app.run(debug=True, host=\"0.0.0.0\", port=7777)/' /code/server.py &&
        python server.py
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request, sys; urllib.request.urlopen('http://localhost:7777/').read(); sys.exit(0)"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

networks:
  private_net:
    driver: bridge
    internal: true
  shared_net:
    driver: bridge

volumes:
  postgres_data:
  simplelogin_data:
