services:
  account_db:
    image: postgres:16
    container_name: account_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: flexisip
      POSTGRES_PASSWORD: flexipass
      POSTGRES_DB: flexisip_accounts
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flexisip -d flexisip_accounts"]
      interval: 5s
      retries: 30
    networks:
      - sip_net

  flexisip:
    build:
      context: ./flexisip  
      dockerfile: docker/Dockerfile
      args:
        njobs: ${NPROC:-4}
    image: flexisip-local
    container_name: flexisip
    restart: unless-stopped
    volumes:
      - ./flexisip.conf:/etc/flexisip/flexisip.conf:ro
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
      - "5061:5061/tcp"
    depends_on:
      account_db:
        condition: service_healthy
    networks:
      - sip_net

networks:
  sip_net:
    driver: bridge
