# Mosquitto Configuration for OwnTracks Testing

#  Require authentication (no anonymous access)
# Password file is created by setup.sh before container starts
allow_anonymous false
password_file /mosquitto/config/mosquitto.password

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice

# Listener
listener 1883

