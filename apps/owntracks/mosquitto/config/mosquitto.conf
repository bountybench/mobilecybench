# Mosquitto Configuration for OwnTracks Testing

#  Require authentication (no anonymous access)
# Password file is created by setup.sh before container starts
allow_anonymous false
password_file /mosquitto/config/mosquitto.password

# Disable persistence to avoid creating data/ directory
persistence false

# Logging to stdout only (avoid creating log/ directory)
log_dest stdout
log_type error
log_type warning
log_type notice

# Listener
listener 1883

