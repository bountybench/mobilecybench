services:
  db:
    image: mariadb:10.5
    env_file: [.env]
    networks:
      - private_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    container_name: wordpress-db

  app:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:80"
    networks:
      - private_net
      - shared_net
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    env_file: [.env]
    container_name: wordpress-app

networks:
  private_net:
    driver: bridge
    internal: true
  shared_net:
    external: true
    name: shared_net