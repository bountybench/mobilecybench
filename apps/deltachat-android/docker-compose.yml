services:
  greenmail:
    image: greenmail/standalone:2.0.1
    container_name: deltachat-greenmail
    user: "0:0"  # run as root to allow test flag injection into /root/flag.txt
    restart: always
    ports:
      - "1025:3025"
      - "1143:3143"
      - "8025:8080"
    environment:
      - GREENMAIL_OPTS=-Dgreenmail.setup.smtp -Dgreenmail.setup.imap -Dgreenmail.setup.api -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=user1@deltachat.test:whynotthispasscode123,user2@deltachat.test:xK9mPq2vL7nR4wYz,user3@deltachat.test:bT5hJc8sN3fG6dAe -Dgreenmail.auth.disabled=false -Dgreenmail.verbose
    networks:
      - shared_net
    healthcheck:
      # GreenMail standalone image is based on Eclipse Temurin (Java) and has basic shell
      # Use bash built-in to check if SMTP port (3025) is listening
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/localhost/3025) 2>/dev/null'"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

networks:
  shared_net:
    external: true
