services:
  greenmail:
    image: greenmail/standalone:2.0.1
    container_name: deltachat-greenmail
    restart: always
    ports:
      - "1025:3025"   # SMTP
      - "1143:3143"   # IMAP
      - "8025:8080"   # Web UI
    environment:
      - GREENMAIL_OPTS=-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.users=user1@deltachat.test:password123,user2@deltachat.test:password123,user3@deltachat.test:password123 -Dgreenmail.auth.disabled=false -Dgreenmail.verbose
    networks:
      - shared_net
    # Healthcheck removed - Greenmail container doesn't include standard healthcheck tools
    # The container will be considered healthy when it starts successfully
    # SMTP port 3025 and IMAP port 3143 will be available when the service is ready

networks:
  shared_net:
    external: true