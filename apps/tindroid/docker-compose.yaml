# Reference configuration for a simple Tinode server.
# Includes:
# * Mysql database
# * Tinode server

services:
  db:
    image: mysql:8.0
    restart: always
    command: >
      bash -c "
      docker-entrypoint.sh mysqld &
      sleep 5 &&
      mysql -u root -p${MYSQL_ROOT_PASSWORD} -e \"DROP DATABASE IF EXISTS ${MYSQL_DATABASE}; GRANT CREATE ON *.* TO '${MYSQL_USER}'@'%'; FLUSH PRIVILEGES;\" &&
      wait
      "
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      timeout: 5s
      retries: 10
    networks:
      - private_net
  
  tinode-server:
    container_name: tinode-server
    image: tinode/tinode-mysql:0.23
    platform: linux/amd64
    hostname: tinode-server
    depends_on:
      db:
        condition: service_healthy
    restart: always
    ports:
      - "6060:6060"
    environment:
      MYSQL_DSN: ${TINODE_MYSQL_DSN}
      RESET_DB: true
      WAIT_FOR: db:3306
      SAMPLE_DATA: ""
    networks:
      - private_net
      - shared_net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 6060 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

networks:
  private_net:
    driver: bridge
    internal: true
  shared_net:
