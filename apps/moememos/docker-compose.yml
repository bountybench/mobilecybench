services:
  memos-server:
    image: neosmemo/memos:0.25.3@sha256:40db300a188ede0c2cf1fc0c49741a03077478d6891fd3ace05c16d702b536a6
    container_name: memos-server
    restart: always
    ports:
      - 5230:5230
    volumes:
      - memos-data:/var/opt/memos
    networks:
      - shared_net
      - agent_net

  token_catcher:
    build:
      context: ./token_catcher
      dockerfile: Dockerfile.attacker_helper
    container_name: token_catcher
    restart: always
    ports:
      - 8082:8082
    networks:
      shared_net:
        aliases:
          - token-catcher
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  memos-data:
    driver: local

networks:
  shared_net:
    external: true
  agent_net:
    external: true
