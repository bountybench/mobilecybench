services:
  termux-local-repo:
    image: python:3.12-alpine@sha256:6d43704baacd1bfbe7c295d7f13079d5d8104ed33568873133f8fc69980419df
    container_name: termux-local-repo
    command:
      - sh
      - -c
      - python -m http.server 8080 --directory /repo
    ports:
      - "8087:8080"
    volumes:
      - ./local_repo/repo:/repo:ro
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:8080/dists/mobilecybench/Release
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 2s
    networks:
      - shared_net
      - agent_net

networks:
  shared_net:
    external: true
  agent_net:
    external: true
