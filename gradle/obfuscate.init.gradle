// gradle/obfuscate.init.gradle
//
// =============================================================================
// SUMMARY
// =============================================================================
// Gradle init script injected at build time (via `gradlew --init-script <abs>`)
// to enable R8 minification, resource shrinking, and the AGP-default ProGuard
// rules on the `release` buildType of any Android *application* subproject in
// the evaluated build, WITHOUT modifying the submodule's `build.gradle`. The
// script is opt-in: it is only applied when build_apk.sh detects the
// `--obfuscate` flag (sets MCB_OBFUSCATE=1 + MCB_OBFUSCATE_INIT_SCRIPT +
// MCB_APP_DIR in the environment) and forwards `--init-script` to gradlew.
//
//
// Key invariants (DO NOT change without testing on a fresh build):
//   1. minifyEnabled MUST be flipped via the AndroidComponents
//      `beforeVariants` hook, not in `afterEvaluate`. AGP 7.1+ creates the
//      variant task graph (including the conditional minifyReleaseWithR8 task)
//      from `beforeVariants`; setting BuildType.minifyEnabled in afterEvaluate
//      runs AFTER task creation and silently produces a non-minified APK.
//      (Diagnosed against AGP 8.7.3 on wallabag: afterEvaluate path logged
//      "minifyEnabled=true" but no R8 task ever ran. The fix is documented.)
//   2. RENAME-ONLY invariant. `shrinkResources` is deliberately NOT flipped
//      — it is an AGP-level resource-shrinking pass independent of ProGuard's
//      `-dontshrink` and would remove resources added by synth-vuln patches.
//      Code shrink + optimize are suppressed via a generated rename-only
//      rule file (written under each project's buildDir/mcb-obfuscate/).
//      The combined effect: R8 runs as a pure symbol-renamer; APK semantics
//      ≈ baseline modulo the symbol map.
//   3. Upstream-forced apps (e.g. moememos with `minifyEnabled true`) are
//      detected and the proguard-android-optimize.txt injection is skipped
//      to preserve their tested ProGuard configuration. The rename-only
//      constraints are STILL appended so the ablation stays uniform across
//      postures.
//
// Known limitation:
//   The rename-only rule file is written from `afterEvaluate` at
//   configuration time. This is NOT compatible with Gradle's
//   configuration cache (`org.gradle.configuration-cache=true`); on a
//   config-cache hit the write does not replay and the file may be
//   missing if `gradle clean` ran since the last write. None of the
//   apps in this benchmark currently enable config-cache, so the
//   limitation is latent. When the first app opts in, move the write
//   into a `doFirst` block on the `minify*WithR8` task (or register a
//   proper WriteFile task wired as an R8 input).
//   4. APPEND to proguardFiles via getProguardFiles()+setProguardFiles(). The
//      DSL helper `release.proguardFiles(...)` REPLACES the list and would
//      silently drop the app's own `proguard-rules.pro`. ProGuard file
//      registration happens in `afterEvaluate` (BuildType DSL, not Variant API).
//   5. Operate only on the `release` buildType. Debug builds stay un-minified
//      so developer tooling continues to work.
//   6. Never throw fatally on missing optional inputs (MCB_APP_DIR unset,
//      androidComponents extension absent on ancient AGP, extra-keep.pro
//      absent). Log lifecycle/warn notices so the operator can see what
//      happened.
// =============================================================================

// `allprojects` so this fires for every subproject in a multi-module build.
// Apps in this benchmark have varying layouts — AnkiDroid's `:AnkiDroid`,
// Thunderbird's `:app-thunderbird`, OpenVPN's `:main`, plus simple flat
// `:app` projects. Iterating allprojects + filtering by plugin id is the
// only selector that catches all of them without per-app knowledge.
allprojects { project ->
    // `plugins.withId('com.android.application')` runs the closure only after
    // the AGP application plugin is applied to this subproject. This filters
    // out library subprojects (com.android.library), pure-Java/Kotlin
    // subprojects, and the root project — none of which have an `android {}`
    // block or a release buildType to mutate.
    project.plugins.withId('com.android.application') {

        // ---------------------------------------------------------------------
        // PHASE 1 — beforeVariants: flip minifyEnabled (rename-only; see
        // invariant #2 — shrinkResources is intentionally left alone).
        // ---------------------------------------------------------------------
        // This must run BEFORE AGP creates the variant task graph, which is
        // why it cannot live in afterEvaluate. The AndroidComponents extension
        // exposes `beforeVariants` for exactly this kind of late-stage DSL
        // override that still needs to influence task creation.
        //
        // If `androidComponents` is absent (ancient AGP < 7.1), fall back to
        // the afterEvaluate path. That path WILL produce a non-minified APK
        // on modern AGP, so we log a hard warning when we take it.
        def hasAndroidComponents = project.extensions.findByName('androidComponents') != null
        if (hasAndroidComponents) {
            project.extensions.configure('androidComponents') { ac ->
                ac.beforeVariants(ac.selector().withBuildType('release')) { variantBuilder ->
                    // Respect upstream-forced minification. If the app's own
                    // build.gradle set minifyEnabled true, vb.minifyEnabled
                    // reflects that here. Leaving it alone preserves the
                    // app's tested ProGuard configuration. These apps should
                    // be tagged "upstream_forced" in metadata.json.
                    //
                    // Record the skip on the project so the afterEvaluate
                    // proguardFiles-append block can also bail out. Without
                    // this flag, by the time afterEvaluate runs we cannot
                    // distinguish "upstream set minifyEnabled true" from "we
                    // set it" (both leave the boolean reading true), and we
                    // would silently inject proguard-android-optimize.txt on
                    // top of apps that deliberately use proguard-android.txt
                    // (e.g. termux's reproducible-builds config).
                    if (variantBuilder.minifyEnabled) {
                        project.extensions.extraProperties.set('mcbObfuscateSkipped', true)
                        project.logger.lifecycle(
                            "[mcb-obfuscate] ${project.path}: release already has " +
                            "minifyEnabled true; leaving config alone (upstream-configured)"
                        )
                        return
                    }
                    variantBuilder.minifyEnabled = true
                    // Deliberately NOT setting shrinkResources. The toggle is
                    // rename-only — resource shrinking is a separate AGP-level
                    // pass (AAPT2 / R8-integrated in AGP 8.12+) that is NOT
                    // controlled by ProGuard's -dontshrink. Leaving resource
                    // shrinking off keeps the obfuscated APK's resource set
                    // identical to baseline, which preserves probe rigor for
                    // synth-vuln patches that add layout/string resources.
                    project.logger.lifecycle(
                        "[mcb-obfuscate] ${project.path}: beforeVariants enabled " +
                        "minify on release (rename-only; shrink/optimize " +
                        "suppressed via generated rename-only rules)"
                    )
                }
            }
        } else {
            project.logger.warn(
                "[mcb-obfuscate] ${project.path}: androidComponents extension " +
                "not found (AGP < 7.1?). Falling back to afterEvaluate path; " +
                "the produced APK will likely NOT be R8-minified."
            )
        }

        // ---------------------------------------------------------------------
        // PHASE 2 — afterEvaluate: append proguardFiles on the BuildType DSL.
        // ---------------------------------------------------------------------
        // ProGuard file lists are consumed at task-config time (after our
        // hooks fire), so the BuildType.proguardFiles mutation in
        // afterEvaluate IS still picked up by R8 — unlike the boolean
        // minifyEnabled flag, which gates the task's existence.
        project.afterEvaluate {
            def android = project.extensions.findByName('android')
            if (android == null) {
                return
            }
            def release = android.buildTypes.findByName('release')
            if (release == null) {
                return
            }

            // Did beforeVariants (or the fallback path below) detect that
            // upstream already has minifyEnabled true? If so we MUST NOT
            // inject proguard-android-optimize.txt — that would silently
            // change the rule set the app is tested against (e.g. injecting
            // -optimize over a deliberate proguard-android.txt choice).
            //
            // The rename-only constraints, however, MUST still be appended
            // even for upstream-forced apps — otherwise those apps run with
            // full shrink+optimize and break the uniform rename-only
            // invariant across the ablation. Same logic for the per-app
            // extra-keep.pro override.

            // On the AGP-less-than-7.1 fallback path we still need to flip
            // minifyEnabled here. The R8 task may not be created, but the
            // configuration will at least be visible to anything that inspects
            // it. shrinkResources is intentionally NOT touched (see phase 1
            // comment — rename-only invariant keeps resource set == baseline).
            //
            // CRITICAL ordering: this block must run BEFORE we compute
            // skipUpstreamRules, because the fallback path is where
            // mcbObfuscateSkipped gets set for AGP<7.1 + upstream-forced apps.
            // Earlier versions of this script computed skipUpstreamRules first
            // and then ran the fallback — the flag write was a no-op for the
            // already-bound local and proguard-android-optimize.txt landed on
            // top of a config that should have been left alone.
            if (!hasAndroidComponents) {
                if (release.minifyEnabled) {
                    // Treat upstream-forced just like the phase 1 path: set the
                    // skip flag so the proguard-android-optimize.txt injection
                    // bails, but still append rename-only + extra-keep.pro
                    // below.
                    project.extensions.extraProperties.set('mcbObfuscateSkipped', true)
                    project.logger.lifecycle(
                        "[mcb-obfuscate] ${project.path}: (fallback) release " +
                        "already has minifyEnabled true; leaving minify+upstream " +
                        "rules alone, still appending rename-only constraints"
                    )
                } else {
                    release.minifyEnabled = true
                }
            }

            // Read the skip flag AFTER the AGP<7.1 fallback may have set it.
            def skipUpstreamRules = project.extensions.extraProperties.has('mcbObfuscateSkipped') &&
                project.extensions.extraProperties.get('mcbObfuscateSkipped')

            // ProGuard files: APPEND, do not REPLACE.
            // The DSL helper `release.proguardFiles(a, b, c)` is a SETTER that
            // replaces the entire list. Using it here would silently drop any
            // `proguard-rules.pro` the app already registered. The safe
            // pattern is read-modify-write via getProguardFiles() +
            // setProguardFiles().
            def existing = release.getProguardFiles() as List
            def additions = []

            if (!skipUpstreamRules) {
                // AGP-shipped default optimization rules. Contents vary across
                // AGP versions — a known measurement caveat, not a bug. Not
                // injected for upstream-forced apps (they already have their
                // own tested ProGuard configuration).
                additions << android.getDefaultProguardFile('proguard-android-optimize.txt')
            }

            // Rename-only invariant. The research target is symbol rename;
            // shrink + optimize introduce confounds (synth-vuln code paths
            // can be DCE'd, optimize can alter control flow vs. baseline).
            // The four directives below are written to a generated .pro file
            // under the project's build dir and appended to proguardFiles.
            // ALWAYS appended — including for upstream-forced apps —
            // otherwise the ablation mixes rename-only and full-minify across
            // apps and the comparison becomes uninterpretable.
            // project.buildDir was deprecated in Gradle 8.10; the layout API
            // has been stable since Gradle 7 (matches our minimum AGP 7.1+
            // target). Avoids the deprecation warning on Gradle 8.10+ and
            // the hard removal in Gradle 9.0.
            def renameOnlyRules = new File(
                project.layout.buildDirectory.get().asFile,
                'mcb-obfuscate/rename-only.pro'
            )
            renameOnlyRules.parentFile.mkdirs()
            renameOnlyRules.text = (
                "-dontshrink\n" +
                "-dontoptimize\n" +
                "-repackageclasses ''\n" +
                "-keepattributes SourceFile,LineNumberTable\n"
            )
            additions << renameOnlyRules
            project.logger.lifecycle(
                "[mcb-obfuscate] ${project.path}: wrote rename-only rules to ${renameOnlyRules.absolutePath}"
            )

            // Optional per-app extra-keep.pro lookup. MCB_APP_DIR is set by
            // build_apk.sh to the absolute path of the current app's
            // directory and lets us inject keep rules that live in the
            // repo (not in the submodule).
            def appRoot = System.getenv('MCB_APP_DIR')
            if (!appRoot) {
                project.logger.lifecycle(
                    "[mcb-obfuscate] ${project.path}: MCB_APP_DIR not set; " +
                    "skipping per-app extra-keep.pro lookup"
                )
            } else {
                def extra = new File(appRoot, 'obfuscation/extra-keep.pro')
                if (extra.exists()) {
                    additions << extra
                    project.logger.lifecycle(
                        "[mcb-obfuscate] ${project.path}: appending ${extra.absolutePath}"
                    )
                }
            }

            release.setProguardFiles(existing + additions)

            project.logger.lifecycle(
                "[mcb-obfuscate] ${project.path}: afterEvaluate registered " +
                "${(existing + additions).size()} proguard files on release"
            )
        }
    }
}
