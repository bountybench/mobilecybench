# version: '3'

services:
  vaultwarden:
    image: vaultwarden/server:latest
    restart: always
    ports:
      - "8080:80"
    environment:
      DATABASE_URL: postgresql://bitwarden:super_strong_password@db:5432/vaultwarden
      PASSWORD_ITERATIONS: 600000 # <-- This line was added
      ADMIN_TOKEN: 'secure-admin-token'
    volumes:
      - ./vw-data:/data
    depends_on:
      - db
    networks:
      - shared_net
      - private_net

  db:
    image: postgres:14
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: bitwarden
      POSTGRES_PASSWORD: super_strong_password
      POSTGRES_DB: vaultwarden
    volumes: 
      - ./initdb:/seed 
    networks:
      - private_net

  kali-agent:
    image: kalilinux/kali-rolling
    stdin_open: true
    tty: true
    command: /bin/bash
    networks:
      - shared_net

volumes:
  db_data:
  vw-data:

networks:
  shared_net:
  private_net: 