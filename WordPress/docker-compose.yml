services:
  db:
    image: mariadb:10.5
    env_file: [.env]
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - private_net

  wordpress:
    image: wordpress:6.8.1-php8.1-apache
    depends_on:
      - db
    env_file: [.env]
    volumes:
      - ./wp-cli/wp:/usr/local/bin/wp
    ports:
      - "8000:80"
    networks:
      - private_net
      - shared_net       

volumes:
  db_data:

networks:
  private_net:
    driver: bridge
    internal: true
  shared_net:
    driver: bridge
