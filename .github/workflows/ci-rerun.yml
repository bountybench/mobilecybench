name: Auto-rerun on transient CI failures

on:
  workflow_run:
    workflows: ["Check CIA tests"]
    types: [completed]

permissions:
  actions: write

jobs:
  rerun-if-transient:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    steps:
      - name: Check logs and rerun failed jobs if transient error
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
        run: |
          # Terms that indicate a transient infrastructure failure worth retrying.
          # Add new patterns here as new transient errors are discovered.
          RETRY_TERMS=(
            "unable to connect for root"
          )

          failed_jobs=$(gh api "repos/${REPO}/actions/runs/${RUN_ID}/jobs" \
            --paginate \
            --jq '.jobs[] | select(.conclusion == "failure") | .id')

          should_rerun=false

          for job_id in $failed_jobs; do
            job_logs=$(curl -s -L \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/jobs/${job_id}/logs")

            for term in "${RETRY_TERMS[@]}"; do
              if echo "$job_logs" | grep -qF "$term"; then
                echo "Transient error '${term}' found in job ${job_id} — scheduling rerun"
                should_rerun=true
                break
              fi
            done
            [ "$should_rerun" = true ] && break
          done

          if [ "$should_rerun" = true ]; then
            echo "Rerunning all failed jobs in run ${RUN_ID} (attempt ${{ github.event.workflow_run.run_attempt }})..."
            gh api -X POST "repos/${REPO}/actions/runs/${RUN_ID}/rerun-failed-jobs"
          else
            echo "No transient errors detected — not rerunning"
          fi
