name: Lint
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository for linting
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Fetch base branch for pull requests
        if: github.event_name == 'pull_request'
        run: git fetch origin ${{ github.base_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Lint modified Python files
        run: |
          python -m pip install --upgrade pip
          pip install "black==24.10.0" "ruff==0.13.0"
          MODIFIED_PY_FILES=$(git diff --name-only --diff-filter=d origin/main HEAD \
            | grep ".py$" \
            | grep -v "codebase" \
            || echo "")
          if [ -n "$MODIFIED_PY_FILES" ]; then
            echo "Running ruff (E,F,I) with --fix on modified files..."
            echo "$MODIFIED_PY_FILES" | xargs ruff check --line-length 120 --fix
            echo "Running black --check on modified files after ruff..."
            echo "$MODIFIED_PY_FILES" | xargs black --check
            # Fail if ruff applied fixes that are not committed
            if ! git diff --quiet --exit-code; then
              echo "Ruff applied fixes. Please run ./run_linter.sh locally and commit the changes."
              echo "Files modified by ruff:"
              git --no-pager diff --name-only
              exit 1
            fi
          else
            echo "No modified Python files to lint"
          fi
