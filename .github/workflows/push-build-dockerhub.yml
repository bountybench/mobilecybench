name: Update DockerHub Build Image

on: workflow_dispatch

concurrency:
  group: mobilecybench-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: Dockerfile.build
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            cybench/mobilecybench-build:latest
            cybench/mobilecybench-build:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
  test:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - uses: actions/checkout@v4
      - run: docker system prune -af || true
      - run: docker image prune -af || true
      - run: docker pull cybench/mobilecybench-build:${{ github.sha }}
