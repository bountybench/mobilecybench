name: Check CIA tests
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modified_dirs: ${{ steps.modified-dirs.outputs.modified_dirs }}
      should_exit: ${{ steps.modified-dirs.outputs.should_exit }}
      has_non_app_changes: ${{ steps.modified-dirs.outputs.has_non_app_changes }}
      sdk: ${{ steps.get-sdk-java.outputs.sdk }}
      java: ${{ steps.get-sdk-java.outputs.java }}
      system_image: ${{ steps.get-sdk-java.outputs.system_image }}
      has_probes: ${{ steps.check-run-checks.outputs.has_probes }}
      setup_modes: ${{ steps.setup-strategy.outputs.setup_modes }}
      has_server: ${{ steps.check-server-components.outputs.has_server }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Disable Git ownership check
        run: git config --global --add safe.directory '*'
        
      - name: Fetch main branch
        run: git fetch origin main:refs/remotes/origin/main

      - name: Find modified directories
        id: modified-dirs
        run: |
          cat << 'EOF' > /tmp/shared_functions.sh
          get_modified_dirs() {
            git diff --diff-filter=ACMDR --name-only origin/main...HEAD |
              grep '^apps/' |
              xargs -n1 dirname |
              awk -F/ 'NF>=2 {print $1"/"$2}' |
              sort -u
          }
          EOF
          chmod +x /tmp/shared_functions.sh
          source /tmp/shared_functions.sh

          # Check if there are any changes outside apps/ directory
          all_changes=$(git diff --diff-filter=ACMDR --name-only origin/main...HEAD)
          non_app_changes=$(echo "$all_changes" | grep -v '^apps/' || true)

          if [ -n "$non_app_changes" ]; then
            echo "Detected changes outside apps/ directory:"
            echo "$non_app_changes"
            echo "has_non_app_changes=true" >> $GITHUB_OUTPUT
          else
            echo "All changes are within apps/ directory"
            echo "has_non_app_changes=false" >> $GITHUB_OUTPUT
          fi

          modified_dirs=$(get_modified_dirs)
          if [ -z "$modified_dirs" ]; then
            echo "No modified directories with essential changes found. Skipping further steps."
            echo "should_exit=true" >> $GITHUB_OUTPUT
          else
            echo "Modified directories:"
            echo "$modified_dirs"

            readarray -t dirs <<< "$modified_dirs"
            count=${#dirs[@]}
            if [ "$count" -gt 1 ]; then
              echo "More than one modified directory detected: ${dirs[*]}"
              echo "Each PR should only modify one app"
              exit 1
            fi

            echo "modified_dirs<<EOF" >> $GITHUB_OUTPUT
            echo "$modified_dirs" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Get API level & Java versions
        if: steps.modified-dirs.outputs.should_exit != 'true'
        id: get-sdk-java
        run: |
          set -e

          # Get the first directory from modified_dirs
          dir=$(echo "${{ steps.modified-dirs.outputs.modified_dirs }}" | head -n1)

          metadata="$dir/metadata.json"
          if [ ! -f "$metadata" ]; then
            echo "ERROR: $metadata not found"
            exit 1
          fi

          sdk=$(jq -r '.sdk' $metadata)
          if [ "$?" -ne 0 ] || [ "$sdk" = "null" ] || [ -z "$sdk" ]; then
              echo "ERROR: Could not extract SDK from $metadata."
              exit 1
          else 
              echo "SDK: $sdk"
          fi

          java=$(jq -r '.java' $metadata)
          if [ "$?" -ne 0 ] || [ "$java" = "null" ] || [ -z "$java" ]; then
              echo "ERROR: Could not extract Java version from $metadata. Use default (17)."
              java=17
          else 
              echo "Java version: $java"
          fi

          if [ "$sdk" -lt 30 ]; then
              system_image="google_apis"
          else
              system_image="google_atd"
          fi
          echo "System image: $system_image"

          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
          echo "java=$java" >> "$GITHUB_OUTPUT"
          echo "system_image=$system_image" >> "$GITHUB_OUTPUT"

      - name: Check if test_X.py probes exist
        if: steps.modified-dirs.outputs.should_exit != 'true'
        id: check-run-checks
        run: |
          dir=$(echo "${{ steps.modified-dirs.outputs.modified_dirs }}" | head -n1)
          if [ -f "$dir/test_access_control.py" ] || [ -f "$dir/test_availability.py" ] || [ -f "$dir/test_confidentiality.py" ] || [ -f "$dir/test_integrity.py" ]; then
            echo "test_X.py probe found in $dir"
            echo "has_probes=true" >> "$GITHUB_OUTPUT"
          else
            echo "test_X.py probe not found in $dir - will run simplified CI"
            echo "has_probes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine app setup strategy
        if: steps.modified-dirs.outputs.should_exit != 'true'
        id: setup-strategy
        run: |
          dir=$(echo "${{ steps.modified-dirs.outputs.modified_dirs }}" | head -n1)
          
          # Check for both setup scripts
          has_source=false
          has_apklink=false

          if [ -f "$dir/setup_app_source.sh" ]; then
            has_source=true
            echo "Found setup_app_source.sh"
          fi

          # Check if download_link exists in metadata.json
          if [ -f "$dir/metadata.json" ]; then
            download_link=$(jq -r '.download_link // empty' "$dir/metadata.json")
            if [ -n "$download_link" ]; then
              has_apklink=true
              echo "Found download_link in metadata.json"
            fi
          fi

          # Validate at least one exists
          if [ "$has_source" = false ] && [ "$has_apklink" = false ]; then
            echo "ERROR: Neither setup_app_source.sh nor download_link in metadata.json found in $dir"
            exit 1
          fi
          
          # Determine which setup modes to test based on script existence and modifications
          echo "has source: $has_source, has apklink: $has_apklink"
          
          # Check which specific scripts were modified
          source_modified=$(git diff --name-only origin/main...HEAD | grep -q "$dir/setup_app_source.sh" && echo "true" || echo "false")
          apklink_modified=$(git diff --name-only origin/main...HEAD | grep -q "$dir/metadata.json" && echo "true" || echo "false")
          
          echo "source modified: $source_modified, apklink modified: $apklink_modified"
          
          if [ "$has_source" = true ] && [ "$has_apklink" = true ]; then
            # Both scripts exist - determine modes based on modifications
            if [ "$source_modified" = "true" ] && [ "$apklink_modified" = "true" ]; then
              echo "Both setup scripts modified - testing both modes"
              setup_modes='["source", "apklink"]'
            elif [ "$source_modified" = "true" ]; then
              echo "Source script modified - using source mode"
              setup_modes='["source"]'
            elif [ "$apklink_modified" = "true" ]; then
              echo "APK link script modified - using apklink mode"
              setup_modes='["apklink"]'
            else
              echo "Both scripts available and unmodified - preferring APK link for efficiency"
              setup_modes='["apklink"]'
            fi
          elif [ "$has_source" = true ] && [ "$has_apklink" = false ]; then
            echo "Only source setup available - using source mode"
            setup_modes='["source"]'
          elif [ "$has_source" = false ] && [ "$has_apklink" = true ]; then
            echo "Only APK link setup available - using apklink mode"
            setup_modes='["apklink"]'
          fi
          
          echo "Selected setup modes: $setup_modes"
          echo "setup_modes=$setup_modes" >> "$GITHUB_OUTPUT"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q
          pip install -e .

      - name: Run unit tests
        if: steps.modified-dirs.outputs.has_non_app_changes == 'true'
        run: |
          echo "Running unit tests..."
          pytest tests/ -v --tb=short

      - name: Skip unit tests
        if: steps.modified-dirs.outputs.has_non_app_changes == 'false'
        run: |
          echo "Skipping unit tests - all changes are in apps/ directory"

      - name: Check metadata.json
        if: steps.modified-dirs.outputs.should_exit != 'true'
        run: |
          dir=$(echo "${{ steps.modified-dirs.outputs.modified_dirs }}" | head -n1)
          if git diff --name-only HEAD^ HEAD | grep -q "$dir/metadata.json"; then
            echo "metadata.json was modified in $dir. Running test..."
            pytest \
              --log-cli-level=INFO \
              --log-cli-format='%(message)s' \
              --tb=no \
              tests/test_metadata_json.py::test_app_metadata \
              --dirs "$dir"
          else
            echo "metadata.json not modified in $dir. Skipping test."
          fi

      - name: Check if app has server components
        if: steps.modified-dirs.outputs.should_exit != 'true'
        id: check-server-components
        run: |
          dir=$(echo "${{ steps.modified-dirs.outputs.modified_dirs }}" | head -n1)
          metadata="$dir/metadata.json"
          
          # Check if app has server components for DoS testing
          # App has server if app_server field is not an empty string
          if [ -f "$metadata" ]; then
            app_server=$(jq -r '.app_server // empty' "$metadata")
            if [ -n "$app_server" ]; then
              echo "App has server components ($app_server) - DoS testing (vuln_scenario_1) will be included"
              echo "has_server=true" >> "$GITHUB_OUTPUT"
            else
              echo "App has no server components (app_server is empty or missing) - DoS testing (vuln_scenario_1) will be skipped"
              echo "has_server=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No metadata.json found - assuming no server components"
            echo "has_server=false" >> "$GITHUB_OUTPUT"
          fi      

  handle_apk:
    needs: setup
    if: needs.setup.outputs.should_exit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        setup_mode: ${{ fromJson(needs.setup.outputs.setup_modes) }}
      fail-fast: false
    
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true # revert back to true if an app build fails due to disk space
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Disable Git ownership check
        run: git config --global --add safe.directory '*'

      - name: Initialize submodule
        run: |
          modified_dirs=${{ needs.setup.outputs.modified_dirs }}
          echo "Initialize submodule for $modified_dirs"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(echo -n "x-access-token:${{ secrets.GH_TOKEN }}" | base64)" submodule update --init "$modified_dirs"

      - name: Checkout commit from metadata
        run: |
          modified_dir="${{ needs.setup.outputs.modified_dirs }}"
          cd "$modified_dir"
          
          if [[ -f "metadata.json" ]]; then
            commit=$(jq -r '.["commit_version"]' "metadata.json")
            
            if [[ -n "$commit" && "$commit" != "null" ]]; then
              echo "Found commit: $commit"
              cd codebase
              git reset --hard HEAD
              sudo git clean -fdx
              git checkout "$commit"
              cd ..
            else
              echo "No commit version found in metadata.json"
              exit 1
            fi
          else
            echo "No metadata.json file found"
            exit 1
          fi
          
      - name: Check for Gradle files
        if: matrix.setup_mode == 'source'
        id: check-gradle
        run: |
          modified_dir="${{ needs.setup.outputs.modified_dirs }}"
          cd "$modified_dir"
          
          # Check for any build.gradle* files in app directory or codebase subdirectory
          if find . -name "build.gradle*" -type f | grep -q .; then
            echo "Gradle build files found"
            echo "has_gradle=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Gradle build files found"
            echo "has_gradle=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "${{ needs.setup.outputs.java }}"
          cache: ${{ steps.check-gradle.outputs.has_gradle == 'true' && 'gradle' || ''}}

      - name: Build or download APK
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GRADLE_OPTS: "-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g -XX:MaxMetaspaceSize=1g"
        run: |
          modified_dir="${{ needs.setup.outputs.modified_dirs }}"
          setup_mode="${{ matrix.setup_mode }}"
          
          cd "$modified_dir"
          
          echo "Setup mode: $setup_mode"
          
          if [ "$setup_mode" = "apklink" ]; then
            echo "Downloading APK from link..."
            app_name=$(basename "$modified_dir")
            cd ../..
            python setup_app_apklink.py "$app_name"
            cd "$modified_dir"
          else
            echo "Building APK from source (this may take 10+ minutes)..."
            ./setup_app_source.sh
          fi
          
          # Validate APK Path
          echo "Validating APK path..."
          APK_DIR="apk"
          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK directory not found at $APK_DIR"
            echo "ERROR: APKs must be placed in ${modified_dir}/apk/"
            exit 1
          fi
          
          APK_COUNT=$(find "$APK_DIR" -maxdepth 1 -name "*.apk" -type f 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK found in $APK_DIR/"
            echo "ERROR: setup_app_source.sh or setup_app_apklink.py must place APKs in ${modified_dir}/apk/"
            exit 1
          fi
          
          echo "APK path validated - found $APK_COUNT APK(s) in $APK_DIR/"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.setup_mode }}-${{ github.run_id }}
          path: ${{ needs.setup.outputs.modified_dirs }}/apk/*.apk
          retention-days: 1
          if-no-files-found: error

      - name: Cleanup Gradle daemons
        if: always()
        run: |
          modified_dir="${{ needs.setup.outputs.modified_dirs }}"
          cd "$modified_dir" || true
          (cd codebase && ./gradlew --stop) || true
          pkill -f GradleDaemon || true
          pkill -f kotlin.daemon.KotlinCompileDaemon || true

  test_full:
    needs: [setup, handle_apk]
    if: needs.setup.outputs.should_exit != 'true' && needs.setup.outputs.has_probes == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      matrix:
        test_type: ${{ fromJson(needs.setup.outputs.has_server == 'true' && '["baseline", "vuln_scenario_0", "vuln_scenario_1"]' || '["baseline", "vuln_scenario_0"]') }}
        setup_mode: ${{ fromJson(needs.setup.outputs.setup_modes) }}
      fail-fast: false
    
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true # revert back to true if an app build fails due to disk space
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Disable Git ownership check
        run: git config --global --add safe.directory '*'

      - name: Create shared functions
        run: |
          cat << 'EOF' > /tmp/shared_functions.sh
          check_app_containers_ready() {
            # Timeout per container in seconds
            TIMEOUT=${TIMEOUT:-180}
            # Interval between checks in seconds
            INTERVAL=${INTERVAL:-1}

            # Get app-specific containers from metadata.json
            containers=""
            if [ -f "metadata.json" ]; then
              # Check for explicit container_names field
              container_names=$(jq -r '.container_names[]? // empty' metadata.json 2>/dev/null)
              if [ -n "$container_names" ]; then
                containers="$container_names"
                echo "Found explicit container_names in metadata.json: $containers"
              fi
            fi

            if [ -z "$containers" ]; then
              echo "No app-specific containers found in metadata.json - skipping container readiness check"
              return 0
            fi

            echo "Checking readiness for app-specific containers: $containers"

            for container in $containers; do
              echo "Checking readiness for $container..."

              # Check if container has a health check
              has_health=$(docker inspect --format '{{if .Config.Healthcheck}}true{{else}}false{{end}}' "$container")
              if [ "$has_health" = "true" ]; then
                echo "Container has a health check. Waiting to become healthy..."
                elapsed=0
                success=0
                while [ $elapsed -lt $TIMEOUT ]; do
                  status=$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null)
                  if [ "$status" == "healthy" ]; then
                    success=1
                    break
                  fi
                  sleep "$INTERVAL"
                  elapsed=$((elapsed + INTERVAL))
                done
                if [ $success -eq 1 ]; then
                  echo "$container is healthy."
                  continue
                else
                  echo "Timeout: $container did not become healthy within $TIMEOUT seconds." >&2
                  exit 1
                fi
              else
                # Get exposed TCP ports
                ports=$(docker inspect --format '{{range $p, $conf := .NetworkSettings.Ports}}{{range $conf}}{{.HostPort}} {{end}}{{end}}' "$container")
                if [ -z "$ports" ]; then
                  echo "No exposed ports for $container. Skipping readiness check." >&2
                  continue
                fi

                elapsed=0
                all_success=0
                while [ $elapsed -lt $TIMEOUT ]; do
                  success=1
                  for port_spec in $ports; do
                    port=$(echo "$port_spec" | cut -d'/' -f1)
                    proto=$(echo "$port_spec" | cut -d'/' -f2)
                    if [ "$proto" != "tcp" ]; then
                      continue  # Skip non-TCP ports
                    fi

                    # Perform TCP check
                    if ! nc -z -w 1 localhost "$port" &>/dev/null; then
                      success=0
                      break
                    fi
                  done

                  if [ $success -eq 1 ]; then
                    all_success=1
                    break
                  fi

                  sleep "$INTERVAL"
                  elapsed=$((elapsed + INTERVAL))
                done

                if [ $all_success -eq 1 ]; then
                  echo "$container is ready via port check on all ports."
                else
                  echo "Timeout: $container not ready after $TIMEOUT seconds." >&2
                  exit 1
                fi
              fi
            done

            echo "App-specific containers are ready!"
          }

          checkout_commit() {
            pwd
            if [[ -f "metadata.json" ]]; then
              commit=$(jq -r '.["commit_version"]' "metadata.json")
              
              if [[ -n "$commit" ]]; then
                echo "Found commit: $commit"

                git submodule update --init codebase
                echo "Cleaning repository to remove all changes and untracked files..."

                cd "codebase" || exit 1

                echo "Cleaning up the codebase"
                git reset --hard HEAD
                sudo git clean -fdx

                # Update the submodule and checkout the commit
                git checkout "$commit"

                cd - || exit 1
              else
                echo "No commit version found in metadata.json"
                exit 1
              fi
            else
              echo "No metadata.json file found"
              exit 1
            fi
          }

          verify_shared_net_connectivity() {
            # Verify shared_net connectivity after containers are started
            echo "Verifying shared_net connectivity..."
            if [ -f "metadata.json" ]; then
              app_server=$(jq -r '.app_server // empty' "metadata.json")
              if [ -n "$app_server" ]; then
                echo "Testing connectivity to: $app_server"
                
                # Strip protocol prefix if present (http://, https://)
                server_clean=$(echo "$app_server" | sed 's|^[^:]*://||')
                echo "  Raw app_server: $app_server"
                echo "  Cleaned server: $server_clean"
                
                # Parse host and port - require explicit port
                if [[ "$server_clean" == *":"* ]]; then
                  host=$(echo "$server_clean" | cut -d':' -f1)
                  port=$(echo "$server_clean" | cut -d':' -f2)
                  echo "  Parsed host: $host"
                  echo "  Parsed port: $port"
                else
                  echo "ERROR: No port specified in app_server: $app_server"
                  exit 1
                fi
                
                echo "  Testing connection to $host:$port via shared_net..."
                docker run --rm --network=shared_net alpine:latest \
                  sh -c "nc -z -w 30 $host $port || (echo 'ERROR: Cannot reach app server via shared_net' && exit 1)"
                
                echo "shared_net connectivity verified"
              else
                echo "No app_server defined in metadata.json, skipping connectivity check"
              fi
            else
              echo "No metadata.json found, skipping connectivity check"
            fi
          }

          EOF
          chmod +x /tmp/shared_functions.sh

          modified_dirs=${{ needs.setup.outputs.modified_dirs }}
          echo "Initialize submodule for $modified_dirs"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(echo -n "x-access-token:${{ secrets.GH_TOKEN }}" | base64)" submodule update --init "$modified_dirs"
          
      - name: Setup Python 3.12 environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q
          pip install -e .
          export ADB_SERVER_SOCKET=tcp:0.0.0.0:5037

      - name: Create Docker Network
        run: docker network create shared_net || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create test script for ${{ matrix.test_type }}
        run: |
          modified_dir="${{ needs.setup.outputs.modified_dirs }}"
          
          cat << 'EOF' > test_checks.sh
          #!/bin/bash
          set -e
          source /tmp/shared_functions.sh
          adb devices
          EOF
          
          echo "dir=\"$modified_dir\"" >> test_checks.sh
          echo "test_type=\"${{ matrix.test_type }}\"" >> test_checks.sh


          case "${{ matrix.test_type }}" in
            "baseline")
              cat <<'EOF' >> test_checks.sh

          # Create dummy file for test confidentiality
          cat > "/tmp/dummy_log.log" <<'DUMMY_EOF'
          # Dummy log file for testing purposes
          # This file contains no actual secrets or sensitive information
          timestamp=2024-01-01T00:00:00Z
          event=test_event
          message=dummy test message
          status=ok
          DUMMY_EOF

          cd "$dir"
          
          # Get package_name from metadata.json (required field) and verify before setup
          package_name=$(jq -r '.package_name' metadata.json)
          echo "Found package_name in metadata.json: $package_name"
          
          # Check if package is NOT installed before setup
          if adb shell pm list packages | grep -q "^package:$package_name$"; then
            echo "ERROR: Package $package_name is already installed before setup.sh"
            echo "This test expects the package to be uninstalled initially"
            exit 1
          else
            echo "SUCCESS: Package $package_name is not installed (as expected before setup)"
          fi
          
          echo "Running setup..."
          ./setup.sh

          #Define Function to uninstall package if not already done by cleanup.sh
          uninstall_package() {
            package_name="$1"

            if adb shell pm list packages | grep -q "^package:$package_name$"; then
              echo "NOTICE: Package $package_name is currently installed. Please uninstall your app in cleanup.sh. Proceeding to uninstall automatically..."
              adb uninstall "$package_name" >/dev/null 2>&1

              #still exists after attempt at uninstall
              if adb shell pm list packages | grep -q "^package:$package_name$"; then
                echo "::warning::ERROR: Failed to uninstall package $package_name"
              else
                echo "SUCCESS: Package $package_name has been successfully uninstalled"
              fi
            fi
          }

          # Verify the specific package is installed after setup
          if adb shell pm list packages | grep -q "^package:$package_name$"; then
            echo "SUCCESS: Package $package_name is installed after setup.sh"
          else
            echo "ERROR: Package $package_name is not installed after setup.sh"
            echo "This indicates setup.sh failed to install the expected package"
            ./cleanup.sh
            exit 1
          fi
          
          # Wait for app-specific containers to be ready (after setup.sh starts them)
          check_app_containers_ready
          
          verify_shared_net_connectivity
          adb logcat -c

          echo "Generating flags..."
          cd ../..
          python -m utils.uuid_flags_utils "$dir"
          cd "$dir"

          echo "Injecting flags..."
          ../../inject_flags.sh

          echo "Running baseline and generic probe checks..."
          ../../run_checks.sh . "/tmp/dummy_log.log"
          
          if ! jq -e '[.. | select(type == "number")] | all(. == 1)' scores.json > /dev/null; then
            echo "ERROR: Baseline scores.json does not contain all 1s."
            cat scores.json
            ./cleanup.sh
            uninstall_package "$package_name"
            exit 1
          fi

          if ! jq -e '[.. | select(type == "number")] | all(. == 1)' generic_scores.json > /dev/null; then
              echo "ERROR: generic_scores.json does not contain all 1s."
              cat generic_scores.json
              ./cleanup.sh
