name: Test MetaMask
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIR: metamask/vulnerabilities/vulnerability_0
      
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find modified metadata/vulnerability directories
        id: modified-dirs
        run: |
          cat << 'EOF' > /tmp/shared_functions.sh
          execute_if_exists() {
            local script_path="$1"
            if [ -f "$script_path" ]; then
              echo "Executing $script_path"
              bash "$script_path"
            else
              echo "$script_path not found, skipping."
            fi
          }

          get_modified_dirs() {
            git diff --diff-filter=ACMDR --name-only origin/main...HEAD | while read -r file; do
              ##################################
              # First part
              ##################################
              # If the file path includes "vulnerabilities/vulnerability_{digits}", extract and echo it.
              if [[ "$file" =~ (.*vulnerabilities/vulnerability_[0-9]+) ]]; then
                dir="${BASH_REMATCH[1]}"
                if [[ -d "$dir" ]]; then
                  echo "$dir"
                fi
              fi

              ##################################
              # Second part
              ##################################
              # Skip if it already matches "vulnerabilities/vulnerability_{digits}" or contains metadata.json
              if [[ "$file" =~ .*/vulnerabilities/vulnerability_[0-9]+ ]] || [[ "$file" =~ metadata.json ]]; then
                continue
              else
                # Get the base directory
                baseDir="$(dirname "$file")"
                # Check if baseDir contains "vulnerabilities" somewhere
                if [[ -d "$baseDir/vulnerabilities" ]]; then
                  rootOfVulnerabilities="$baseDir/vulnerabilities"
                  # For each bounty subfolder under rootOfVulnerabilities, echo if non-essentials check passes
                  for subDir in "$rootOfVulnerabilities"/vulnerability_[0-9]*; do
                    if [[ -d "$subDir" && "$subDir" =~ /vulnerability_[0-9]+$ ]]; then
                      echo "$subDir"
                    fi
                  done
                fi
              fi
            done | sort -u
          }

          check_server_ready() {
            # Timeout per container in seconds
            TIMEOUT=${TIMEOUT:-180}
            # Interval between checks in seconds
            INTERVAL=${INTERVAL:-1}

            # Get all running containers
            containers=$(docker ps --format '{{.Names}}')

            for container in $containers; do
              echo "Checking readiness for $container..."

              # Check if container has a health check
              has_health=$(docker inspect --format '{{if .Config.Healthcheck}}true{{else}}false{{end}}' "$container")
              if [ "$has_health" = "true" ]; then
                echo "Container has a health check. Waiting to become healthy..."
                elapsed=0
                success=0
                while [ $elapsed -lt $TIMEOUT ]; do
                  status=$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null)
                  if [ "$status" == "healthy" ]; then
                    success=1
                    break
                  fi
                  sleep "$INTERVAL"
                  elapsed=$((elapsed + INTERVAL))
                done
                if [ $success -eq 1 ]; then
                  echo "$container is healthy."
                  continue
                else
                  echo "Timeout: $container did not become healthy within $TIMEOUT seconds." >&2
                  exit 1
                fi
              else
                # Get exposed TCP ports
                ports=$(docker inspect --format '{{range $p, $conf := .NetworkSettings.Ports}}{{range $conf}}{{.HostPort}} {{end}}{{end}}' "$container")
                if [ -z "$ports" ]; then
                  echo "No exposed ports for $container. Skipping readiness check." >&2
                  continue
                fi

                elapsed=0
                all_success=0
                while [ $elapsed -lt $TIMEOUT ]; do
                  success=1
                  for port_spec in $ports; do
                    port=$(echo "$port_spec" | cut -d'/' -f1)
                    proto=$(echo "$port_spec" | cut -d'/' -f2)
                    if [ "$proto" != "tcp" ]; then
                      continue  # Skip non-TCP ports
                    fi

                    # Perform TCP check
                    if ! nc -z -w 1 localhost "$port" &>/dev/null; then
                      success=0
                      break
                    fi
                  done

                  if [ $success -eq 1 ]; then
                    all_success=1
                    break
                  fi

                  sleep "$INTERVAL"
                  elapsed=$((elapsed + INTERVAL))
                done

                if [ $all_success -eq 1 ]; then
                  echo "$container is ready via port check on all ports."
                else
                  echo "Timeout: $container not ready after $TIMEOUT seconds." >&2
                  exit 1
                fi
              fi
            done

            echo "All containers are ready!"
          }

          EOF
          chmod +x /tmp/shared_functions.sh
          source /tmp/shared_functions.sh
          modified_dirs=$(get_modified_dirs)
          if [ -z "$modified_dirs" ]; then
            echo "No modified directories with essential changes found. Skipping further steps."
            echo "should_exit=true" >> $GITHUB_OUTPUT
          else
            echo "Modified directories:"
            echo "$modified_dirs"

            echo "modified_dirs<<EOF" >> $GITHUB_OUTPUT
            echo "$modified_dirs" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Fetch main branch
        run: git fetch origin main:refs/remotes/origin/main

      - name: Set up JDK
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      
      - name: Setup Python 3.9 environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0
          python -m pip install --upgrade pip -q
          pip install -r .github/requirements.txt -q

      - name: Docker Cleanup before pulling new image
        #if: steps.modified-dirs.outputs.should_exit != 'true'
        run: |
          docker system prune -af
          docker image prune -af

      - name: Pull Docker Container
        #if: steps.modified-dirs.outputs.should_exit != 'true'
        run: |
          docker pull --quiet cybench/kali-linux-ci:latest
          docker manifest inspect cybench/kali-linux-ci:latest
          docker image tag cybench/kali-linux-ci:latest cybench

      - name: Display disk space after pulling image
        #if: steps.modified-dirs.outputs.should_exit != 'true'
        run: df -H

      - name: Create Docker Network
        #if: steps.modified-dirs.outputs.should_exit != 'true'
        run: docker network create shared_net || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      
      - name: Parse metadata
        id: parse-metadata
        run: |
          set -e

          metadata="$DIR/metadata.json"
          if [ ! -f "$metadata" ]; then
            echo "ERROR: $metadata not found"
            exit 1
          fi

          sdk=$(jq -r '.sdk' $metadata)
          if [ "$?" -ne 0 ] || [ "$sdk" = "null" ] || [ -z "$sdk" ]; then
              echo "${ERROR} Could not extract SDK from $metadata. Use default (28)."
              sdk=28
          else 
              echo "SDK: $sdk"
          fi

          vuln_version=$(jq -r '.app_vulnerable_version' "$metadata")
          if ! vuln_version=$(jq -r '.app_vulnerable_version' "$metadata") || [ "$vuln_version" = "null" ] || [ -z "$vuln_version" ]; then
            echo "ERROR: Could not extract vulnerable version of app from $metadata."
            exit 1
          fi

          patched_version=$(jq -r '.app_patched_version' "$metadata")
          if ! patched_version=$(jq -r '.app_patched_version' "$metadata") || [ "$patched_version" = "null" ] || [ -z "$patched_version" ]; then
            echo "ERROR: Could not extract patched version of app from $metadata."
            exit 1
          fi

          echo "Now in $(pwd)"
          cd "$DIR" || exit 1
          echo "Now in $(pwd)"

          exploit_script="exploit.sh"
          verify_script="verify.sh"
          setup_app_script="setup_app.sh"

          # Check if scripts exist and are executable
          for script in "$exploit_script" "$verify_script" "$setup_app_script"; do
            if [ ! -f "$script" ]; then
              echo -e "ERROR: Could not find $script"
              exit 1
            fi
            chmod +x "$script"
          done

          echo -e "CHECKING IF NECESSARY SCRIPTS EXIST"
          echo -e "SUCCESS: Found exploit script at: ${exploit_script}"
          echo -e "SUCCESS: Found verify script at: ${verify_script}"
          echo -e "SUCCESS: Found setup app script at: ${setup_app_script}"

          # Export versions for use in subsequent steps
          {
            echo "sdk=$sdk"
            echo "vuln_version=$vuln_version"
            echo "patched_version=$patched_version"
            echo "exploit_script=$exploit_script"
            echo "verify_script=$verify_script"
            echo "setup_app_script=$setup_app_script"
          } >> "$GITHUB_OUTPUT"

      - name: Create exploit test script
        run: |
          echo "Generating test_exploit.sh"

          source /tmp/shared_functions.sh
          check_server_ready

          vuln_version="${{ steps.parse-metadata.outputs.vuln_version }}"
          dir=metamask/vulnerabilities/vulnerability_0

          cat << EOF > test_exploit.sh
          #!/bin/bash
          set -e

          adb wait-for-device
          adb shell getprop sys.boot_completed
          adb devices
          adb shell input keyevent 82

          vuln_version="${vuln_version}"
          dir="${dir}"

          echo "SETTING UP THE APP"          
          bash "metamask/vulnerabilities/vulnerability_0/setup_app.sh" "$vuln_version"

          # Run the exploit and verification for this task
          echo "Running exploit and verification test for $dir"
          pytest -v --log-cli-level=INFO --log-cli-format='%(message)s' --tb=no tests/test_exploit.py::test_exploit_workflow --dirs metamask/vulnerabilities/vulnerability_0
          EOF

          chmod +x test_exploit.sh

      - name: Test exploit workflow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: "${{ steps.parse-metadata.outputs.sdk }}"
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 2048    
          force-avd-creation: true
          emulator-options: -no-snapshot-save -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -skin 1080x1920 -memory 2048 -camera-back none
          disable-animations: true
          script: ./test_exploit.sh

      - name: Docker Cleanup before pulling new image
        #if: steps.modified-dirs.outputs.should_exit != 'true'
        run: |
          docker system prune -af
          docker image prune -af

      - name: Pull Docker Container
        #if: steps.modified-dirs.outputs.should_exit != 'true'
        run: |
          docker pull --quiet cybench/kali-linux-ci:latest
          docker manifest inspect cybench/kali-linux-ci:latest
          docker image tag cybench/kali-linux-ci:latest cybench
      
      - name: Create Docker Network
        #if: steps.modified-dirs.outputs.should_exit != 'true'
        run: docker network create shared_net || true

      - name: Create patch test script
        run: |
          echo "Generating test_exploit.sh"

          patched_version="${{ steps.parse-metadata.outputs.patched_version }}"
          verify_script="${{ steps.parse-metadata.outputs.verify_script }}"
          exploit_script="${{ steps.parse-metadata.outputs.exploit_script }}"
          setup_app_script="${{ steps.parse-metadata.outputs.setup_app_script }}"

          cat << EOF > test_patch.sh
          #!/bin/bash
          set -e

          adb wait-for-device
          adb shell getprop sys.boot_completed
          adb devices
          adb shell input keyevent 82

          cd "$DIR" || { echo "Failed to cd into $DIR"; exit 1; }

          echo "APPLYING PATCH"
          patched_version="${patched_version}"
          verify_script="${verify_script}"
          exploit_script="${exploit_script}"
          setup_app_script="${setup_app_script}"

          echo "SETTING UP THE APP"
          ./"$setup_app_script" "$patched_version"

          echo "RUNNING VERIFY SCRIPT BEFORE EXPLOIT"
          initial_log=$(./"$verify_script")
          initial_status=$?
          if [[ ${initial_status} -eq 0 ]]; then
            echo "ERROR: Verify script before exploit should fail (return 1)"
            echo "${initial_log}"
            exit 1
          fi

          echo "EXPLOIT"
          ./"$exploit_script"
          sleep 5

          echo "RUNNING VERIFY SCRIPT AFTER EXPLOIT"
          final_log=$(./"$verify_script")
          final_status=$?
          if [[ ${final_status} -eq 0 ]]; then
            echo "ERROR: Verify script after patch should still fail (return 1), but it returned 0"
            echo "========= Error log ========="
            echo "${final_log}"
            exit 1
          fi

          echo "PATCH MODE SUCCEEDED"
          echo "Patch completed successfully."
          EOF

          chmod +x test_patch.sh

      - name: Test patch workflow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: "${{ steps.parse-metadata.outputs.sdk }}"
          arch: x86_64
          target: google_apis
          profile: pixel_2    
          ram-size: 2048    
          force-avd-creation: true
          emulator-options: -no-snapshot-save -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -skin 1080x1920 -memory 2048 -camera-back none
          disable-animations: true
          script: ./test_patch.sh
      
      - name: Display disk space after tests
        #if: steps.modified-dirs.outputs.should_exit != 'true'
        run: df -h

      - name: Docker Cleanup after tests
        #if: steps.modified-dirs.outputs.should_exit != 'true'
        run: |
          docker system prune -af

      - name: Display disk space after cleanup
        #if: steps.modified-dirs.outputs.should_exit != 'true'
        run: df -h