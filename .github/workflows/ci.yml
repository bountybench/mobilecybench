name: Check CIA tests
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      modified_dirs: ${{ steps.modified-dirs.outputs.modified_dirs }}
      should_exit: ${{ steps.modified-dirs.outputs.should_exit }}
      sdk: ${{ steps.get-sdk-java.outputs.sdk }}
      java: ${{ steps.get-sdk-java.outputs.java }}
      system_image: ${{ steps.get-sdk-java.outputs.system_image }}
      has_run_checks: ${{ steps.check-run-checks.outputs.has_run_checks }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Disable Git ownership check
        run: git config --global --add safe.directory '*'
        
      - name: Fetch main branch
        run: git fetch origin main:refs/remotes/origin/main

      - name: Find modified directories
        id: modified-dirs
        run: |
          cat << 'EOF' > /tmp/shared_functions.sh
          get_modified_dirs() {
            git diff --diff-filter=ACMDR --name-only origin/main...HEAD |
              grep '^apps/' |
              xargs -n1 dirname |   
              awk -F/ 'NF>=2 {print $1"/"$2}' |
              sort -u
          }
          EOF
          chmod +x /tmp/shared_functions.sh
          source /tmp/shared_functions.sh
          modified_dirs=$(get_modified_dirs)
          if [ -z "$modified_dirs" ]; then
            echo "No modified directories with essential changes found. Skipping further steps."
            echo "should_exit=true" >> $GITHUB_OUTPUT
          else
            echo "Modified directories:"
            echo "$modified_dirs"
          
            readarray -t dirs <<< "$modified_dirs"
            count=${#dirs[@]}
            if [ "$count" -gt 1 ]; then
              echo "More than one modified directory detected: ${dirs[*]}"
              echo "Each PR should only modify one app"
              exit 1
            fi

            echo "modified_dirs<<EOF" >> $GITHUB_OUTPUT
            echo "$modified_dirs" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Get API level & Java versions
        if: steps.modified-dirs.outputs.should_exit != 'true'
        id: get-sdk-java
        run: |
          set -e

          # Get the first directory from modified_dirs
          dir=$(echo "${{ steps.modified-dirs.outputs.modified_dirs }}" | head -n1)

          metadata="$dir/metadata.json"
          if [ ! -f "$metadata" ]; then
            echo "ERROR: $metadata not found"
            exit 1
          fi

          sdk=$(jq -r '.sdk' $metadata)
          if [ "$?" -ne 0 ] || [ "$sdk" = "null" ] || [ -z "$sdk" ]; then
              echo "ERROR: Could not extract SDK from $metadata."
              exit 1
          else 
              echo "SDK: $sdk"
          fi

          java=$(jq -r '.java' $metadata)
          if [ "$?" -ne 0 ] || [ "$java" = "null" ] || [ -z "$java" ]; then
              echo "${ERROR} Could not extract Java version from $metadata. Use default (17)."
              java=17
          else 
              echo "Java version: $java"
          fi

          if [ "$sdk" -lt 30 ]; then
              system_image="google_apis"
          else
              system_image="google_atd"
          fi
          echo "System image: $system_image"

          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"
          echo "java=$java" >> "$GITHUB_OUTPUT"
          echo "system_image=$system_image" >> "$GITHUB_OUTPUT"

      - name: Check if run_checks.sh exists
        if: steps.modified-dirs.outputs.should_exit != 'true'
        id: check-run-checks
        run: |
          dir=$(echo "${{ steps.modified-dirs.outputs.modified_dirs }}" | head -n1)
          if [ -f "$dir/run_checks.sh" ]; then
            echo "run_checks.sh found in $dir"
            echo "has_run_checks=true" >> "$GITHUB_OUTPUT"
          else
            echo "run_checks.sh not found in $dir - will run simplified CI"
            echo "has_run_checks=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.modified-dirs.outputs.should_exit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q
          export ADB_SERVER_SOCKET=tcp:0.0.0.0:5037

      - name: Check metadata.json
        if: steps.modified-dirs.outputs.should_exit != 'true'
        run: |
          dir=$(echo "${{ steps.modified-dirs.outputs.modified_dirs }}" | head -n1)
          if git diff --name-only HEAD^ HEAD | grep -q "$dir/metadata.json"; then
            echo "metadata.json was modified in $dir. Running test..."
            pytest \
              --log-cli-level=INFO \
              --log-cli-format='%(message)s' \
              --tb=no \
              tests/test_metadata_json.py::test_app_metadata \
              --dirs "$dir"
          else
            echo "metadata.json not modified in $dir. Skipping test."
          fi      

  test_full:
    needs: setup
    if: needs.setup.outputs.should_exit != 'true' && needs.setup.outputs.has_run_checks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      matrix:
        test_type: [baseline, vuln_scenario_0, vuln_scenario_1]
      fail-fast: false  
      max-parallel: 3 
    
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Disable Git ownership check
        run: git config --global --add safe.directory '*'

      - name: Create shared functions
        run: |
          cat << 'EOF' > /tmp/shared_functions.sh
          check_server_ready() {
            # Timeout per container in seconds
            TIMEOUT=${TIMEOUT:-180}
            # Interval between checks in seconds
            INTERVAL=${INTERVAL:-1}

            # Get all running containers
            containers=$(docker ps --format '{{.Names}}')

            for container in $containers; do
              echo "Checking readiness for $container..."

              # Check if container has a health check
              has_health=$(docker inspect --format '{{if .Config.Healthcheck}}true{{else}}false{{end}}' "$container")
              if [ "$has_health" = "true" ]; then
                echo "Container has a health check. Waiting to become healthy..."
                elapsed=0
                success=0
                while [ $elapsed -lt $TIMEOUT ]; do
                  status=$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null)
                  if [ "$status" == "healthy" ]; then
                    success=1
                    break
                  fi
                  sleep "$INTERVAL"
                  elapsed=$((elapsed + INTERVAL))
                done
                if [ $success -eq 1 ]; then
                  echo "$container is healthy."
                  continue
                else
                  echo "Timeout: $container did not become healthy within $TIMEOUT seconds." >&2
                  exit 1
                fi
              else
                # Get exposed TCP ports
                ports=$(docker inspect --format '{{range $p, $conf := .NetworkSettings.Ports}}{{range $conf}}{{.HostPort}} {{end}}{{end}}' "$container")
                if [ -z "$ports" ]; then
                  echo "No exposed ports for $container. Skipping readiness check." >&2
                  continue
                fi

                elapsed=0
                all_success=0
                while [ $elapsed -lt $TIMEOUT ]; do
                  success=1
                  for port_spec in $ports; do
                    port=$(echo "$port_spec" | cut -d'/' -f1)
                    proto=$(echo "$port_spec" | cut -d'/' -f2)
                    if [ "$proto" != "tcp" ]; then
                      continue  # Skip non-TCP ports
                    fi

                    # Perform TCP check
                    if ! nc -z -w 1 localhost "$port" &>/dev/null; then
                      success=0
                      break
                    fi
                  done

                  if [ $success -eq 1 ]; then
                    all_success=1
                    break
                  fi

                  sleep "$INTERVAL"
                  elapsed=$((elapsed + INTERVAL))
                done

                if [ $all_success -eq 1 ]; then
                  echo "$container is ready via port check on all ports."
                else
                  echo "Timeout: $container not ready after $TIMEOUT seconds." >&2
                  exit 1
                fi
              fi
            done

            echo "All containers are ready!"
          }

          checkout_commit() {
            pwd
            if [[ -f "metadata.json" ]]; then
              commit=$(jq -r '.["commit_version"]' "metadata.json")
              
              if [[ -n "$commit" ]]; then
                echo "Found commit: $commit"

                git submodule update --init codebase
                echo "Cleaning repository to remove all changes and untracked files..."

                cd "codebase" || exit 1

                echo "Cleaning up the codebase"
                git reset --hard HEAD
                sudo git clean -fdx

                # Update the submodule and checkout the commit
                git checkout "$commit"

                cd - || exit 1
              else
                echo "No commit version found in metadata.json"
                exit 1
              fi
            else
              echo "No metadata.json file found"
              exit 1
            fi
          }

          EOF
          chmod +x /tmp/shared_functions.sh

          modified_dirs=${{ needs.setup.outputs.modified_dirs }}
          echo "Initialize submodule for $modified_dirs"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(echo -n "x-access-token:${{ secrets.GH_TOKEN }}" | base64)" submodule update --init "$modified_dirs"
          
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "${{ needs.setup.outputs.java }}"
          cache: gradle
            
      - name: Setup Python 3.12 environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q
          export ADB_SERVER_SOCKET=tcp:0.0.0.0:5037

      - name: Create Docker Network
        run: docker network create shared_net || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create test script for ${{ matrix.test_type }}
        run: |
          modified_dir="${{ needs.setup.outputs.modified_dirs }}"
          
          cat << 'EOF' > test_checks.sh
          #!/bin/bash
          set -e
          source /tmp/shared_functions.sh
          check_server_ready
          adb devices
          EOF
          
          echo "dir=\"$modified_dir\"" >> test_checks.sh
          echo "test_type=\"${{ matrix.test_type }}\"" >> test_checks.sh

          case "${{ matrix.test_type }}" in
            "baseline")
              cat <<'EOF' >> test_checks.sh

          # Create dummy file for test confidentiality
          cat > "dummy_log.log" <<'DUMMY_EOF'
          # Dummy log file for testing purposes
          # This file contains no actual secrets or sensitive information
          timestamp=2024-01-01T00:00:00Z
          event=test_event
          message=dummy test message
          status=ok
          DUMMY_EOF

          cd "$dir"
          echo "Running setup..."
          ./setup.sh
          adb logcat -c
          
          echo "Running baseline checks..."
          ./run_checks.sh "dummy_log.log"
          
          if ! jq -e '[.. | select(type == "number")] | all(. == 1)' scores.json > /dev/null; then
            echo "ERROR: Baseline scores.json does not contain all 1s."
            cat scores.json
            ./cleanup.sh
            exit 1
          fi
          
          echo "Baseline checks passed. Cleaning up..."
          ./cleanup.sh
          EOF
              ;;
            "vuln_scenario_0")
              cat <<'EOF' >> test_checks.sh
          
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          
          cd "$dir"
          echo "Running setup..."
          ./setup.sh
          adb logcat -c
          
          echo "Creating vulnerable scenario 0..."
          cd vuln_scenarios/vuln_scenario_0
          ./vuln.sh
          cd -
          
          echo "Running checks..."
          ./run_checks.sh "vuln_scenarios/vuln_scenario_0/fake_agent_log.log"
          
          score1="vuln_scenarios/vuln_scenario_0/expected_scores.json"
          score2="scores.json"
          
          if diff <(jq -S . "$score1") <(jq -S . "$score2") >/dev/null; then
            echo "Vuln scenario 0 scores match. Cleaning up..."
            ./cleanup.sh
          else
            echo "ERROR: Vuln scenario 0 scores do not match"
            cat scores.json
            ./cleanup.sh
            exit 1
          fi
          EOF
              ;;
            "vuln_scenario_1")
              cat <<'EOF' >> test_checks.sh

          # Create dummy file for test confidentiality
          cat > "dummy_log.log" <<'DUMMY_EOF'
          # Dummy log file for testing purposes
          # This file contains no actual secrets or sensitive information
          timestamp=2024-01-01T00:00:00Z
          event=test_event
          message=dummy test message
          status=ok
          DUMMY_EOF

          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_HOME
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          
          cd "$dir"
          echo "Running setup..."
          ./setup.sh
          adb logcat -c
          
          echo "Creating vulnerable scenario 1..."
          cd vuln_scenarios/vuln_scenario_1
          ./vuln.sh
          cd -
          
          echo "Running checks..."
          ./run_checks.sh "dummy_log.log"
          
          score1="vuln_scenarios/vuln_scenario_1/expected_scores.json"
          score2="scores.json"
          
          if diff <(jq -S . "$score1") <(jq -S . "$score2") >/dev/null; then
            echo "Vuln scenario 1 scores match. Cleaning up..."
            ./cleanup.sh
          else
            echo "ERROR: Vuln scenario 1 scores do not match"
            cat scores.json
            ./cleanup.sh
            exit 1
          fi
          EOF
              ;;
          esac
          
          chmod +x test_checks.sh

      - name: Create build source script
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GRADLE_OPTS: "-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g -XX:MaxMetaspaceSize=1g"
        run: |
          modified_dir="${{ needs.setup.outputs.modified_dirs }}"

          cat << 'EOF' > build_source.sh
          #!/bin/bash
          set -e
          git config --global --add safe.directory '*'
          
          source /tmp/shared_functions.sh
          check_server_ready
          EOF
          echo "dir=\"$modified_dir\"" >> build_source.sh
          cat <<'EOF' >> build_source.sh
          cd "$dir"
          checkout_commit "$dir"

          required_scripts=("setup.sh" "cleanup.sh" "test_access_control.py" "test_availability.py" "test_confidentiality.py" "test_integrity.py" "setup_app_source.sh")
          echo "Checking for required scripts..."
          for script in "${required_scripts[@]}"; do
            if [[ ! -f "$script" ]]; then
              echo "ERROR: Required script '$script' not found."
              exit 1
            fi
          done

          echo "Setting up app from source..."
          ./setup_app_source.sh
          EOF
          chmod +x build_source.sh
          free -h
          ./build_source.sh
                
      - name: Stabilize runner after build
        run: |
          echo "Memory usage immediately after build:"
          free -h
          modified_dir="${{ needs.setup.outputs.modified_dirs }}"
          cd "$modified_dir" || true
          
          (cd codebase && ./gradlew --stop) || true
          pkill -f GradleDaemon || true
          pkill -f kotlin.daemon.KotlinCompileDaemon || true
          jps -v | grep -E 'GradleDaemon|Kotlin' || true
          echo "Memory usage after stopping Gradle daemons:"
          free -h
          set -euo pipefail
          THRESHOLD=4096 # 4GB
          MAX_TRIES=24  # 2 minutes at 5s interval
          TRIES=0
          INTERVAL=5
          echo "Waiting for available memory to exceed ${THRESHOLD}MB..."
          while ((TRIES < MAX_TRIES)); do
            AVAILABLE_MEM=$(awk '/MemAvailable/ { printf "%d", $2/1024 }' /proc/meminfo)
            echo "Current available memory on attempt ${TRIES}/${MAX_TRIES}: ${AVAILABLE_MEM}MB"
            if (( AVAILABLE_MEM > THRESHOLD )); then
              echo "Memory threshold of ${THRESHOLD}MB crossed. Continuing..."
              break
            fi
            echo "Retrying in ${INTERVAL} seconds..."
            (( ++TRIES ))
            sleep "${INTERVAL}"
          done
          if (( TRIES >= MAX_TRIES )); then
            echo "Timeout waiting for memory to exceed ${THRESHOLD}MB"; 
            exit 1
          fi
          echo "Final memory usage:"
          free -h

      - name: Pre-emulator Resource Check
        run: |
          echo "=== Pre-Emulator Resource Check ==="
          
          # Check if CPU usage is acceptable
          CPU_USAGE=$(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | sed 's/%us,//' | cut -d'.' -f1)
          if [ "$CPU_USAGE" -gt 25 ]; then
            echo "WARNING: CPU usage too high ($CPU_USAGE%). Emulator may hang."
            echo "Top processes:"
            ps aux --sort=-%cpu | head -10
            
            # Try to kill more processes
            sudo pkill -f chrome || true
            sudo pkill -f firefox || true
            sleep 10
          fi
          
          # Check memory
          AVAILABLE_MEM=$(free -m | awk 'NR==2{printf "%.0f", $7/1024}')
          if [ "$AVAILABLE_MEM" -lt 2 ]; then
            echo "WARNING: Low available memory (${AVAILABLE_MEM}GB)"
            free -h
          fi
          
          echo "System ready for emulator. CPU: ${CPU_USAGE}%, Available Memory: ${AVAILABLE_MEM}GB"

      - name: Run emulator test with action (vuln_scenario_0)
        if: matrix.test_type == 'vuln_scenario_0'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ needs.setup.outputs.sdk }}
          arch: x86_64
          target: ${{ needs.setup.outputs.system_image }} 
          profile: pixel_2
          ram-size: 2048    
          force-avd-creation: true
          emulator-options: -no-snapshot-save -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -skin 1080x1920 -memory 2048 -camera-back none -writable-system
          disable-animations: true
          script: |
            utils/android_emulator_ready.sh --remount
            ./test_checks.sh

      - name: Run emulator test with action (baseline and vuln_scenario_1)
        if: matrix.test_type != 'vuln_scenario_0'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ needs.setup.outputs.sdk }}
          arch: x86_64
          target: ${{ needs.setup.outputs.system_image }} 
          profile: pixel_2
          ram-size: 2048    
          force-avd-creation: true
          emulator-options: -no-snapshot-save -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -skin 1080x1920 -memory 2048 -camera-back none
          disable-animations: true
          script: ./test_checks.sh

      - name: Display disk space after tests
        if: always()
        run: df -h

      - name: Docker Cleanup after tests
        if: always()
        run: |
          docker system prune -af

      - name: Display disk space after cleanup
        if: always()
        run: df -h

  test_simple:
    needs: setup
    if: needs.setup.outputs.should_exit != 'true' && needs.setup.outputs.has_run_checks == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Disable Git ownership check
        run: git config --global --add safe.directory '*'

      - name: Create shared functions
        run: |
          cat << 'EOF' > /tmp/shared_functions.sh
          checkout_commit() {
            pwd
            if [[ -f "metadata.json" ]]; then
              commit=$(jq -r '.["commit_version"]' "metadata.json")
              
              if [[ -n "$commit" ]]; then
                echo "Found commit: $commit"

                git submodule update --init codebase
                echo "Cleaning repository to remove all changes and untracked files..."

                cd "codebase" || exit 1

                echo "Cleaning up the codebase"
                git reset --hard HEAD
                sudo git clean -fdx

                # Update the submodule and checkout the commit
                git checkout "$commit"

                cd - || exit 1
              else
                echo "No commit version found in metadata.json"
                exit 1
              fi
            else
              echo "No metadata.json file found"
              exit 1
            fi
          }
          EOF
          chmod +x /tmp/shared_functions.sh

          modified_dirs=${{ needs.setup.outputs.modified_dirs }}
          echo "Initialize submodule for $modified_dirs"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(echo -n "x-access-token:${{ secrets.GH_TOKEN }}" | base64)" submodule update --init "$modified_dirs"
          
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "${{ needs.setup.outputs.java }}"
          cache: gradle
            
      - name: Setup Python 3.12 environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q
          export ADB_SERVER_SOCKET=tcp:0.0.0.0:5037

      - name: Create Docker Network
        run: docker network create shared_net || true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Create simple test script
        run: |
          modified_dir="${{ needs.setup.outputs.modified_dirs }}"
          
          cat << 'EOF' > simple_test.sh
          #!/bin/bash
          set -e
          source /tmp/shared_functions.sh
          adb devices
          EOF
          
          echo "dir=\"$modified_dir\"" >> simple_test.sh
          cat <<'EOF' >> simple_test.sh
          
          cd "$dir"
          echo "Simple APK build and install test - no vulnerability scenarios"
          
          # Check packages before setup
          packages_before=$(adb shell pm list packages | wc -l)
          echo "Packages before setup: $packages_before"
          
          echo "Running setup..."
          ./setup.sh
          adb logcat -c
          
          # Check packages after setup
          packages_after=$(adb shell pm list packages | wc -l)
          echo "Packages after setup: $packages_after"
          
          if [ "$packages_after" -gt "$packages_before" ]; then
            echo "SUCCESS: Package count increased ($packages_before -> $packages_after) - app installation verified"
          elif [ "$packages_after" -eq "$packages_before" ]; then
            echo "WARNING: Package count unchanged - setup may not have installed new packages"
            echo "This could be expected if app was already installed or uses system components"
          else
            echo "ERROR: Package count decreased ($packages_before -> $packages_after) - unexpected behavior"
            exit 1
          fi
          
          echo "Cleaning up..."
          ./cleanup.sh
          EOF
          
          chmod +x simple_test.sh

      - name: Create build source script
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          GRADLE_OPTS: "-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g -XX:MaxMetaspaceSize=1g"
        run: |
          modified_dir="${{ needs.setup.outputs.modified_dirs }}"

          cat << 'EOF' > build_source.sh
          #!/bin/bash
          set -e
          git config --global --add safe.directory '*'
          
          source /tmp/shared_functions.sh
          EOF
          echo "dir=\"$modified_dir\"" >> build_source.sh
          cat <<'EOF' >> build_source.sh
          cd "$dir"
          checkout_commit "$dir"

          required_scripts=("setup.sh" "cleanup.sh" "setup_app_source.sh")
          echo "Checking for required scripts..."
          for script in "${required_scripts[@]}"; do
            if [[ ! -f "$script" ]]; then
              echo "ERROR: Required script '$script' not found."
              exit 1
            fi
          done

          echo "Setting up app from source..."
          ./setup_app_source.sh
          EOF
          chmod +x build_source.sh
          free -h
          ./build_source.sh
                
      - name: Stabilize runner after build
        run: |
          echo "Memory usage immediately after build:"
          free -h
          modified_dir="${{ needs.setup.outputs.modified_dirs }}"
          cd "$modified_dir" || true
          
          (cd codebase && ./gradlew --stop) || true
          pkill -f GradleDaemon || true
          pkill -f kotlin.daemon.KotlinCompileDaemon || true
          jps -v | grep -E 'GradleDaemon|Kotlin' || true
          echo "Memory usage after stopping Gradle daemons:"
          free -h
          set -euo pipefail
          THRESHOLD=4096 # 4GB
          MAX_TRIES=24  # 2 minutes at 5s interval
          TRIES=0
          INTERVAL=5
          echo "Waiting for available memory to exceed ${THRESHOLD}MB..."
          while ((TRIES < MAX_TRIES)); do
            AVAILABLE_MEM=$(awk '/MemAvailable/ { printf "%d", $2/1024 }' /proc/meminfo)
            echo "Current available memory on attempt ${TRIES}/${MAX_TRIES}: ${AVAILABLE_MEM}MB"
            if (( AVAILABLE_MEM > THRESHOLD )); then
              echo "Memory threshold of ${THRESHOLD}MB crossed. Continuing..."
              break
            fi
            echo "Retrying in ${INTERVAL} seconds..."
            (( ++TRIES ))
            sleep "${INTERVAL}"
          done
          if (( TRIES >= MAX_TRIES )); then
            echo "Timeout waiting for memory to exceed ${THRESHOLD}MB"; 
            exit 1
          fi
          echo "Final memory usage:"
          free -h

      - name: Pre-emulator Resource Check
        run: |
          echo "=== Pre-Emulator Resource Check ==="
          
          # Check if CPU usage is acceptable
          CPU_USAGE=$(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | sed 's/%us,//' | cut -d'.' -f1)
          if [ "$CPU_USAGE" -gt 25 ]; then
            echo "WARNING: CPU usage too high ($CPU_USAGE%). Emulator may hang."
            echo "Top processes:"
            ps aux --sort=-%cpu | head -10
            
            # Try to kill more processes
            sudo pkill -f chrome || true
            sudo pkill -f firefox || true
            sleep 10
          fi
          
          # Check memory
          AVAILABLE_MEM=$(free -m | awk 'NR==2{printf "%.0f", $7/1024}')
          if [ "$AVAILABLE_MEM" -lt 2 ]; then
            echo "WARNING: Low available memory (${AVAILABLE_MEM}GB)"
            free -h
          fi
          
          echo "System ready for emulator. CPU: ${CPU_USAGE}%, Available Memory: ${AVAILABLE_MEM}GB"

      - name: Run emulator simple test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ needs.setup.outputs.sdk }}
          arch: x86_64
          target: ${{ needs.setup.outputs.system_image }} 
          profile: pixel_2
          ram-size: 2048    
          force-avd-creation: true
          emulator-options: -no-snapshot-save -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -skin 1080x1920 -memory 2048 -camera-back none
          disable-animations: true
          script: |
            utils/android_emulator_ready.sh
            ./simple_test.sh

      - name: Display disk space after tests
        if: always()
        run: df -h

      - name: Docker Cleanup after tests
        if: always()
        run: |
          docker system prune -af

      - name: Display disk space after cleanup
        if: always()
        run: df -h