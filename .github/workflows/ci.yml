name: Check pytest tests
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Disable Git ownership check
        run: git config --global --add safe.directory '*'
        
      - name: Fetch main branch
        run: git fetch origin main:refs/remotes/origin/main

      - name: Find modified directories
        id: modified-dirs
        run: |
          cat << 'EOF' > /tmp/shared_functions.sh
          get_modified_dirs() {
            git diff --diff-filter=ACMDR --name-only origin/main...HEAD |
              grep '^app/' |           
              awk -F/ '{print $1"/"$2}' | 
              sort -u
          }

          check_server_ready() {
            # Timeout per container in seconds
            TIMEOUT=${TIMEOUT:-180}
            # Interval between checks in seconds
            INTERVAL=${INTERVAL:-1}

            # Get all running containers
            containers=$(docker ps --format '{{.Names}}')

            for container in $containers; do
              echo "Checking readiness for $container..."

              # Check if container has a health check
              has_health=$(docker inspect --format '{{if .Config.Healthcheck}}true{{else}}false{{end}}' "$container")
              if [ "$has_health" = "true" ]; then
                echo "Container has a health check. Waiting to become healthy..."
                elapsed=0
                success=0
                while [ $elapsed -lt $TIMEOUT ]; do
                  status=$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null)
                  if [ "$status" == "healthy" ]; then
                    success=1
                    break
                  fi
                  sleep "$INTERVAL"
                  elapsed=$((elapsed + INTERVAL))
                done
                if [ $success -eq 1 ]; then
                  echo "$container is healthy."
                  continue
                else
                  echo "Timeout: $container did not become healthy within $TIMEOUT seconds." >&2
                  exit 1
                fi
              else
                # Get exposed TCP ports
                ports=$(docker inspect --format '{{range $p, $conf := .NetworkSettings.Ports}}{{range $conf}}{{.HostPort}} {{end}}{{end}}' "$container")
                if [ -z "$ports" ]; then
                  echo "No exposed ports for $container. Skipping readiness check." >&2
                  continue
                fi

                elapsed=0
                all_success=0
                while [ $elapsed -lt $TIMEOUT ]; do
                  success=1
                  for port_spec in $ports; do
                    port=$(echo "$port_spec" | cut -d'/' -f1)
                    proto=$(echo "$port_spec" | cut -d'/' -f2)
                    if [ "$proto" != "tcp" ]; then
                      continue  # Skip non-TCP ports
                    fi

                    # Perform TCP check
                    if ! nc -z -w 1 localhost "$port" &>/dev/null; then
                      success=0
                      break
                    fi
                  done

                  if [ $success -eq 1 ]; then
                    all_success=1
                    break
                  fi

                  sleep "$INTERVAL"
                  elapsed=$((elapsed + INTERVAL))
                done

                if [ $all_success -eq 1 ]; then
                  echo "$container is ready via port check on all ports."
                else
                  echo "Timeout: $container not ready after $TIMEOUT seconds." >&2
                  exit 1
                fi
              fi
            done

            echo "All containers are ready!"
          }

          checkout_commit() {
            local dir="$1"
            if [[ -f "$dir/metadata.json" ]]; then
              commit=$(jq -r '.["commit_version"]' "$dir/metadata.json")
              
              if [[ -n "$commit" ]]; then
                echo "Found commit: $commit in $dir"

                git submodule update --init "$dir"
                echo "Cleaning repository to remove all changes and untracked files..."
                checkout_main "$dir"

                cd "codebase" || exit 1

                # Update the submodule and checkout the commit
                git checkout "$commit"

                cd - || exit 1
              else
                echo "No commit version found in $dir/metadata.json"
                exit 1
              fi
            else
              echo "No metadata.json file found in $dir"
              exit 1
            fi
          }

          checkout_main() {
            local dir="$1"
            echo "Checking out main branch at codebase"
            cd "codebase" || exit 1
            echo "Cleaning up the codebase"
            git reset --hard HEAD
            sudo git clean -fdx

            echo "Checking if 'main' branch exists"
            if git rev-parse --verify main >/dev/null 2>&1; then
              echo "'main' branch exists"
            else
              echo "'main' branch does NOT exist."
              if git rev-parse --verify master >/dev/null 2>&1; then
                echo "'master' branch exists - renaming 'master' to 'main'"
                git branch -m master main
              elif git rev-parse --verify develop >/dev/null 2>&1; then
                echo "'develop' branch exists - renaming 'develop' to 'main'"
                git branch -m develop main
              else
                echo "Neither 'main' nor 'master' branch exists. Exiting."
                exit 1
              fi
            fi

            # Checkout 'main' branch
            echo "Checking out 'main' branch at codebase"
            git checkout main --force
            cd - || exit 1
          }

          EOF
          chmod +x /tmp/shared_functions.sh
          source /tmp/shared_functions.sh
          modified_dirs=$(get_modified_dirs)
          if [ -z "$modified_dirs" ]; then
            echo "No modified directories with essential changes found. Skipping further steps."
            echo "should_exit=true" >> $GITHUB_OUTPUT
          else
            echo "Modified directories:"
            echo "$modified_dirs"

            # Extract base directories from modified_dirs
            base_dirs=$(echo "$modified_dirs" | while IFS= read -r line; do
              # Skip empty lines
              [[ -z "$line" ]] && continue
              # Extract the base directory (everything before the first "/")
              echo "${line%%/*}"
            done | sort -u)

            echo "$base_dirs" | while IFS= read -r base; do
              if [ -d "$base" ]; then
                echo "Initialize submodule for $base"
                git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(echo -n "x-access-token:${{ secrets.GH_TOKEN }}" | base64)" submodule update --init "$base"
              else
                echo "$base does not exist."
              fi
            done

            echo "modified_dirs<<EOF" >> $GITHUB_OUTPUT
            echo "$modified_dirs" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      
      - name: Setup Python 3.9 environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0
          python -m pip install --upgrade pip -q
          pip install -r .github/requirements.txt -q
          export ADB_SERVER_SOCKET=tcp:0.0.0.0:5037

      - name: Docker Cleanup before pulling new image
        if: steps.modified-dirs.outputs.should_exit != 'true'
        run: |
          docker system prune -af
          docker image prune -af

      - name: Build Docker Image
        if: steps.modified-dirs.outputs.should_exit != 'true'
        run: |
          docker build -t custom-kali-linux-ci -f .github/Dockerfile .github

      - name: Tag Docker Image
        if: steps.modified-dirs.outputs.should_exit != 'true'
        run: |
          docker image tag custom-kali-linux-ci cybench

      - name: Display disk space after pulling image
        if: steps.modified-dirs.outputs.should_exit != 'true'
        run: df -H

      - name: Create Docker Network
        if: steps.modified-dirs.outputs.should_exit != 'true'
        run: docker network create shared_net || true

      - name: Enable KVM
        if: steps.modified-dirs.outputs.should_exit != 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      
      - name: Get SDK
        if: steps.modified-dirs.outputs.should_exit != 'true'
        id: get-sdk
        run: |
          set -e

          # Get the first directory from modified_dirs
          first_dir=$(echo "${{ steps.modified-dirs.outputs.modified_dirs }}" | head -n1)

          metadata="$first_dir/metadata.json"
          if [ ! -f "$metadata" ]; then
            echo "ERROR: $metadata not found"
            exit 1
          fi

          sdk=$(jq -r '.sdk' $metadata)
          if [ "$?" -ne 0 ] || [ "$sdk" = "null" ] || [ -z "$sdk" ]; then
              echo "${ERROR} Could not extract SDK from $metadata. Use default (28)."
              sdk=28
          else 
              echo "SDK: $sdk"
          fi

          echo "sdk=$sdk" >> "$GITHUB_OUTPUT"

      - name: Create CIA check script
        if: steps.modified-dirs.outputs.should_exit != 'true'
        run: |
          echo "Generating test_cia_check.sh"

          cat << 'EOF' > test_cia_check.sh
          #!/bin/bash
          set -e

          source /tmp/shared_functions.sh
          check_server_ready      
          dir="app/joplin"
          checkout_commit "$dir"
          cd $dir

          required_scripts=("setup_env.sh" "run_cia_check.sh" "cleanup_env.sh")
          echo "Checking for required scripts..."
          for script in "${required_scripts[@]}"; do
            if [[ ! -f "$script" ]]; then
              echo "ERROR: Required script '$script' not found."
              exit 1
            fi
          done

          echo "Running setup..."
          ./setup_env.sh

          echo "Running CIA check..."
          ./run_cia_check.sh

          echo "Cleaning up..."
          ./cleanup_env.sh

          echo "Verifying cia_scores.json contains all 1s..."
          if ! jq -e 'all(.[] == 1)' cia_scores.json > /dev/null; then
            echo "ERROR: cia_scores.json does not contain all 1s."
            cat cia_scores.json
            exit 1
          fi

          echo "CIA check passed successfully. All scores are 1."
          exit 0
          EOF

          cat test_cia_check.sh
          chmod +x test_cia_check.sh

      - name: Test checks
        if: steps.modified-dirs.outputs.should_exit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: "${{ steps.get-sdk.outputs.sdk }}"
          arch: x86_64
          target: google_apis
          profile: pixel_2
          ram-size: 2048    
          force-avd-creation: true
          emulator-options: -no-snapshot-save -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -skin 1080x1920 -memory 2048 -camera-back none
          disable-animations: true
          script: ./test_cia_check.sh
      
      - name: Display disk space after tests
        if: steps.modified-dirs.outputs.should_exit != 'true'
        run: df -h

      - name: Docker Cleanup after tests
        if: steps.modified-dirs.outputs.should_exit != 'true'
        run: |
          docker system prune -af

      - name: Display disk space after cleanup
        if: steps.modified-dirs.outputs.should_exit != 'true'
        run: df -h