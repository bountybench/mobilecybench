          cd "$dir"

          echo "Injecting flags..."
          ../../inject_flags.sh

          echo "Cleaning up..."
          ./cleanup.sh
          uninstall_package "$package_name"
          EOF
          
          chmod +x simple_test.sh

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-${{ matrix.setup_mode }}-${{ github.run_id }}
          path: ${{ needs.setup.outputs.modified_dirs }}/apk/

