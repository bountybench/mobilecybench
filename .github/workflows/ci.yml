      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-${{ matrix.app_name }}-${{ matrix.setup_mode }}${{ matrix.vuln_id && format('-{0}', matrix.vuln_id) || '' }}-${{ github.run_id }}
          path: ${{ matrix.app_dir }}/apk/

      - name: Verify downloaded APK
        run: |
          echo "Verifying APK downloaded for ${{ matrix.app_name }} (setup_mode: ${{ matrix.setup_mode }})"
          ls -lhR "${{ matrix.app_dir }}/apk/"

          APK_COUNT=$(find "${{ matrix.app_dir }}/apk/" -maxdepth 1 -name "*.apk" -type f 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK found after download"
            exit 1
          fi

          echo "Successfully downloaded $APK_COUNT clean APK(s)"

          # For synthetic_vuln, also verify the vulnerable APK exists
          if [ "${{ matrix.test_type }}" = "synthetic_vuln" ] && [ -n "${{ matrix.vuln_id }}" ]; then
            VULN_APK_DIR="${{ matrix.app_dir }}/apk/${{ matrix.vuln_id }}"
            VULN_APK_COUNT=$(find "$VULN_APK_DIR" -maxdepth 1 -name "*.apk" -type f 2>/dev/null | wc -l)
            if [ "$VULN_APK_COUNT" -eq 0 ]; then
              echo "ERROR: No vulnerable APK found in $VULN_APK_DIR/"
              exit 1
            fi
            echo "Successfully found $VULN_APK_COUNT vulnerable APK(s) in $VULN_APK_DIR/"
          fi

      - name: Verify required test files
        run: |
          cd "${{ matrix.app_dir }}"

          if [ "${{ matrix.test_type }}" = "simple" ]; then
            required_files=("start_runtime.sh" "cleanup.sh")
          elif [ "${{ matrix.test_type }}" = "synthetic_vuln" ]; then
            required_files=("start_runtime.sh" "cleanup.sh")
            # Also check synthetic vuln specific files
            vuln_dir="synthetic_vulnerabilities/${{ matrix.vuln_id }}"
            for req_file in "exploit_files/exploit.sh" "verify_files/verify_exploit.sh" "metadata.json"; do
              if [[ ! -f "${vuln_dir}/${req_file}" ]]; then
                echo "ERROR: Required synthetic vuln file '${vuln_dir}/${req_file}' not found."
                exit 1
              fi
            done
            echo "Synthetic vulnerability files verified for ${{ matrix.vuln_id }}"
          else
            required_files=("start_runtime.sh" "cleanup.sh" "test_access_control.py" "test_availability.py" "test_confidentiality.py" "test_integrity.py" "secrets.json")
          fi

          echo "Checking for required test files..."
          for script in "${required_files[@]}"; do
            if [[ ! -f "$script" ]]; then
              echo "ERROR: Required file '$script' not found."
              exit 1
            fi
          done

          echo "All required test files present"

      - name: Pre-emulator Resource Check
        run: |
          echo "=== Pre-Emulator Resource Check ==="
          
          # Check if CPU usage is acceptable
          CPU_USAGE=$(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | sed 's/%us,//' | cut -d'.' -f1)
          if [ "$CPU_USAGE" -gt 25 ]; then
            echo "WARNING: CPU usage too high ($CPU_USAGE%). Emulator may hang."
            echo "Top processes:"
            ps aux --sort=-%cpu | head -10
            
            # Try to kill more processes
            sudo pkill -f chrome || true
            sudo pkill -f firefox || true
            sleep 10
          fi
          
          # Check memory
          AVAILABLE_MEM=$(free -m | awk 'NR==2{printf "%.0f", $7/1024}')
          if [ "$AVAILABLE_MEM" -lt 2 ]; then
            echo "WARNING: Low available memory (${AVAILABLE_MEM}GB)"
            free -h
          fi
          
          echo "System ready for emulator. CPU: ${CPU_USAGE}%, Available Memory: ${AVAILABLE_MEM}GB"

      - name: Run emulator test with action (vuln_scenario_0)
        if: matrix.test_type == 'vuln_scenario_0'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.sdk }}
          arch: x86_64
          target: ${{ matrix.system_image }}
          profile: pixel_2
          ram-size: 2048
          force-avd-creation: true
          emulator-options: -no-snapshot-save -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -skin 1080x1920 -memory 2048 -camera-back emulated -writable-system
          disable-animations: true
          script: |
            utils/android_emulator_ready.sh --remount
            ./test_checks.sh

      - name: Run emulator test with action (other test types)
        if: matrix.test_type != 'vuln_scenario_0'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.sdk }}
          arch: x86_64
          target: ${{ matrix.system_image }}
          profile: pixel_2
          ram-size: 2048
          force-avd-creation: true
          emulator-options: -no-snapshot-save -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -skin 1080x1920 -memory 2048 -camera-back emulated
          disable-animations: true
          script: |
            utils/android_emulator_ready.sh
            ./test_checks.sh

      - name: Display disk space after tests
        if: always()
        run: df -h

      - name: Stop SSRF Listener
        if: always()
        run: |
          source /tmp/shared_functions.sh
          stop_ssrf_listener || true

      - name: Docker Cleanup after tests
        if: always()
        run: |
          docker system prune -af

      - name: Display disk space after cleanup
        if: always()
        run: df -h
