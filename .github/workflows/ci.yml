          ./start_runtime.sh

          uninstall_package() {
            package_name="$1"

            if adb shell pm list packages | grep -q "^package:$package_name$"; then
              echo "NOTICE: Package $package_name is currently installed. Please uninstall your app in cleanup.sh. Proceeding to uninstall automatically..."
              adb uninstall "$package_name" >/dev/null 2>&1

              if adb shell pm list packages | grep -q "^package:$package_name$"; then
                echo "::warning::ERROR: Failed to uninstall package $package_name"
              else
                echo "SUCCESS: Package $package_name has been successfully uninstalled"
              fi
            fi
          }

          # Verify the specific package is installed after setup
          if adb shell pm list packages | grep -q "^package:$package_name$"; then
            echo "SUCCESS: Package $package_name is installed after start_runtime.sh"
          else
            echo "ERROR: Package $package_name is not installed after start_runtime.sh"
            echo "This indicates start_runtime.sh failed to install the expected package"
            ./cleanup.sh
            exit 1
          fi

          # Wait for app-specific containers to be ready (after start_runtime.sh starts them)
          check_app_containers_ready

          verify_shared_net_connectivity
          adb logcat -c


          echo "Generating flags..."
          cd ../..
          python -m utils.uuid_flags_utils "$dir"
          cd "$dir"

          echo "Injecting flags..."
          ../../inject_flags.sh

          # Drive victim login + capture post-login baselines for apps that ship
          # prepare_victim.sh. Runs AFTER inject_flags.sh to mirror redteam's
          # _restart_runtime(inject_flags=...) → _run_prepare_victim() ordering,
          # so post-login baselines reflect the flag-injected app state.
          if [ -x ./prepare_victim.sh ]; then
            echo "Running prepare_victim.sh..."
            ./prepare_victim.sh
          fi

          echo "Cleaning up..."
          ./cleanup.sh
          uninstall_package "$package_name"
          EOF
              ;;
            *)
              echo "ERROR: Unknown test_type: ${{ matrix.test_type }}"
              exit 1
              ;;
          esac

          chmod +x test_checks.sh

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: apk-${{ matrix.app_name }}-${{ matrix.setup_mode }}${{ matrix.vuln_id && format('-{0}', matrix.vuln_id) || '' }}-${{ github.run_id }}
          path: ${{ matrix.app_dir }}/apk/

      - name: Verify downloaded APK
        run: |
          echo "Verifying APK downloaded for ${{ matrix.app_name }} (setup_mode: ${{ matrix.setup_mode }})"
          ls -lhR "${{ matrix.app_dir }}/apk/"

          APK_COUNT=$(find "${{ matrix.app_dir }}/apk/" -maxdepth 1 -name "*.apk" -type f 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK found after download"
            exit 1
          fi

          echo "Successfully downloaded $APK_COUNT clean APK(s)"

          # For synthetic_vuln, also verify the vulnerable APK exists
          if [ "${{ matrix.test_type }}" = "synthetic_vuln" ] && [ -n "${{ matrix.vuln_id }}" ]; then
            VULN_APK_DIR="${{ matrix.app_dir }}/apk/${{ matrix.vuln_id }}"
            VULN_APK_COUNT=$(find "$VULN_APK_DIR" -maxdepth 1 -name "*.apk" -type f 2>/dev/null | wc -l)
            if [ "$VULN_APK_COUNT" -eq 0 ]; then
              echo "ERROR: No vulnerable APK found in $VULN_APK_DIR/"
              exit 1
            fi
            echo "Successfully found $VULN_APK_COUNT vulnerable APK(s) in $VULN_APK_DIR/"
          fi

      - name: Verify required test files
        run: |
          cd "${{ matrix.app_dir }}"

          if [ "${{ matrix.test_type }}" = "simple" ]; then
            required_files=("start_runtime.sh" "cleanup.sh")
          elif [ "${{ matrix.test_type }}" = "synthetic_vuln" ]; then
            required_files=("start_runtime.sh" "cleanup.sh")
            # Also check synthetic vuln specific files based on attacker_model.
            vuln_dir="synthetic_vulnerabilities/${{ matrix.vuln_id }}"
            attacker_model=$(jq -r '.attacker_model' "${vuln_dir}/metadata.json")
            case "$attacker_model" in
              malicious_app)
                # build_exploit_apk.sh is injected from templates/malicious_app
                # at replay time, so it is not required to be checked in.
                vuln_required=("exploit_files/exploit_apk/AndroidManifest.xml" "verify_files/verify_exploit.sh" "metadata.json")
                ;;
              remote_attacker)
                vuln_required=("exploit_files/exploit.sh" "verify_files/verify_exploit.sh" "metadata.json")
                ;;
              *)
                echo "ERROR: Unsupported attacker_model '${attacker_model}' in ${vuln_dir}/metadata.json"
                exit 1
                ;;
            esac
            for req_file in "${vuln_required[@]}"; do
              if [[ ! -f "${vuln_dir}/${req_file}" ]]; then
                echo "ERROR: Required synthetic vuln file '${vuln_dir}/${req_file}' not found."
                exit 1
              fi
            done
            if [ "$attacker_model" = "malicious_app" ]; then
              if ! find "${vuln_dir}/exploit_files/exploit_apk/src" -name '*.java' -print -quit 2>/dev/null | grep -q .; then
                echo "ERROR: No Java sources under ${vuln_dir}/exploit_files/exploit_apk/src"
                exit 1
              fi
            fi
            echo "Synthetic vulnerability files verified for ${{ matrix.vuln_id }}"
          else
            required_files=("start_runtime.sh" "cleanup.sh" "test_access_control.py" "test_availability.py" "test_confidentiality.py" "test_integrity.py" "secrets.json")
          fi

          echo "Checking for required test files..."
          for script in "${required_files[@]}"; do
            if [[ ! -f "$script" ]]; then
              echo "ERROR: Required file '$script' not found."
              exit 1
            fi
          done

          echo "All required test files present"

      - name: Pre-emulator Resource Check
        run: |
          echo "=== Pre-Emulator Resource Check ==="
          
          # Check if CPU usage is acceptable
          CPU_USAGE=$(top -bn1 | grep "Cpu(s)" | awk '{print $2}' | sed 's/%us,//' | cut -d'.' -f1)
          if [ "$CPU_USAGE" -gt 25 ]; then
            echo "WARNING: CPU usage too high ($CPU_USAGE%). Emulator may hang."
            echo "Top processes:"
            ps aux --sort=-%cpu | head -10
            
            # Try to kill more processes
            sudo pkill -f chrome || true
            sudo pkill -f firefox || true
            sleep 10
          fi
          
          # Check memory
          AVAILABLE_MEM=$(free -m | awk 'NR==2{printf "%.0f", $7/1024}')
          if [ "$AVAILABLE_MEM" -lt 2 ]; then
            echo "WARNING: Low available memory (${AVAILABLE_MEM}GB)"
            free -h
          fi
          
          echo "System ready for emulator. CPU: ${CPU_USAGE}%, Available Memory: ${AVAILABLE_MEM}GB"

      - name: Run emulator test with action
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.sdk }}
          arch: x86_64
          target: ${{ matrix.system_image }}
          profile: pixel_2
          ram-size: 2048
          force-avd-creation: true
          emulator-options: -no-snapshot-save -wipe-data -no-window -gpu swiftshader -noaudio -no-boot-anim -memory 2048 -read-only
          disable-animations: true
          # ADB must listen on all interfaces so the adb-proxy sidecar can
          # reach host:5037 via its second NIC on Docker's default bridge.
          # Start the server before the emulator launches; restarting ADB
          # after the runner has booted the emulator races with the runner's
          # own ADB commands and can leave two daemons fighting for port 5037.
          pre-emulator-launch-script: |
            adb kill-server || true
            adb -a -P 5037 start-server
          script: |
            adb wait-for-device
            utils/android_emulator_ready.sh
            utils/inject_system_ca.sh
            ./test_checks.sh

      - name: Display disk space after tests
        if: always()
        run: df -h

      - name: Stop SSRF Listener
        if: always()
        run: |
          source /tmp/shared_functions.sh
          stop_ssrf_listener || true

      - name: Docker Cleanup after tests
        if: always()
        run: |
          docker system prune -af

      - name: Display disk space after cleanup
        if: always()
        run: df -h
