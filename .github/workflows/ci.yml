          EXPLOIT_IMAGE="${EXPLOIT_IMAGE:-cybench/mobilecybench:latest}"

          cd "$dir"

          # Get package_name from metadata.json
          package_name=$(jq -r '.package_name' metadata.json)
          echo "Found package_name in metadata.json: $package_name"

          uninstall_package() {
            local pkg="$1"
            if adb shell pm list packages | grep -q "^package:${pkg}$"; then
              echo "NOTICE: Package $pkg is currently installed. Uninstalling..."
              adb uninstall "$pkg" >/dev/null 2>&1
              if adb shell pm list packages | grep -q "^package:${pkg}$"; then
                echo "::warning::ERROR: Failed to uninstall package $pkg"
              else
                echo "SUCCESS: Package $pkg has been successfully uninstalled"
              fi
            fi
          }

          vuln_dir="synthetic_vulnerabilities/${vuln_id}"
          exploit_files_path="$(pwd)/${vuln_dir}/exploit_files"
          verify_script="$(pwd)/${vuln_dir}/verify_files/verify_exploit.sh"

          # Validate required files
          for req_file in "${vuln_dir}/exploit_files/exploit.sh" "${vuln_dir}/verify_files/verify_exploit.sh" "${vuln_dir}/metadata.json"; do
            if [ ! -f "$req_file" ]; then
              echo "ERROR: Required file not found: $req_file"
              exit 1
            fi
          done

          run_exploit_and_verify() {
            local phase_name="$1"
            local expect_vulnerable="$2"

            echo "=== Phase: $phase_name (expect_vulnerable=$expect_vulnerable) ==="

            # Wait for app containers
            check_app_containers_ready

            # Start exploit container
            container_name="mobilecybench-exploit-$$"
            echo "Starting exploit container: $container_name"
            docker run -d \
              --name "$container_name" \
              --network=shared_net \
              --add-host=host.docker.internal:host-gateway \
              -e ADB_SERVER_SOCKET=tcp:host.docker.internal:5037 \
              -v "$exploit_files_path:/app/exploit_files" \
              "$EXPLOIT_IMAGE" \
              tail -f /dev/null

            # Run exploit
            echo "Running exploit script..."
            docker exec "$container_name" bash /app/exploit_files/exploit.sh || true

            # Cleanup exploit container
            docker rm -f "$container_name" 2>/dev/null || true

            # Run verification on host
            echo "Running verification script..."
            chmod +x "$verify_script"
            set +e
            bash "$verify_script"
            verify_exit=$?
            set -e

            if [ "$expect_vulnerable" = "true" ]; then
              if [ "$verify_exit" -eq 0 ]; then
                echo "SUCCESS: Vulnerable build IS vulnerable (as expected)"
              else
                echo "ERROR: Vulnerable build is NOT vulnerable (expected exit 0, got $verify_exit)"
                return 1
              fi
            else
              if [ "$verify_exit" -ne 0 ]; then
                echo "SUCCESS: Clean build is NOT vulnerable (as expected)"
              else
                echo "ERROR: Clean build IS vulnerable (expected exit != 0, got 0)"
                return 1
              fi
            fi
          }

          # ==============================
          # Phase 1: Clean build (expect NOT vulnerable)
          # ==============================
          echo ""
          echo "============================================"
          echo "Phase 1: Testing clean build (should NOT be vulnerable)"
          echo "============================================"

          # Check package is not installed
          if adb shell pm list packages | grep -q "^package:$package_name$"; then
            echo "ERROR: Package $package_name is already installed before Phase 1"
            exit 1
          fi

          echo "Running setup with clean APK..."
          ./start_runtime.sh

          if ! adb shell pm list packages | grep -q "^package:$package_name$"; then
            echo "ERROR: Package $package_name is not installed after start_runtime.sh"
            ./cleanup.sh
            exit 1
          fi

          run_exploit_and_verify "Clean build" "false"
          phase1_result=$?

          echo "Cleaning up Phase 1..."
          ./cleanup.sh
          uninstall_package "$package_name"

          if [ "$phase1_result" -ne 0 ]; then
            echo "ERROR: Phase 1 (clean build) failed"
            exit 1
          fi

          # ==============================
          # Phase 2: Vulnerable build (expect IS vulnerable)
          # ==============================
          echo ""
          echo "============================================"
          echo "Phase 2: Testing vulnerable build (SHOULD be vulnerable)"
          echo "============================================"

          # Check package is not installed
          if adb shell pm list packages | grep -q "^package:$package_name$"; then
            echo "ERROR: Package $package_name is already installed before Phase 2"
            exit 1
          fi

          echo "Running setup with vulnerable APK..."
          ./start_runtime.sh --apk "apk/${vuln_id}/${app_name}.apk"

          if ! adb shell pm list packages | grep -q "^package:$package_name$"; then
            echo "ERROR: Package $package_name is not installed after start_runtime.sh (vuln)"
            ./cleanup.sh
            exit 1
          fi

          run_exploit_and_verify "Vulnerable build" "true"
          phase2_result=$?

          echo "Cleaning up Phase 2..."
          ./cleanup.sh
          uninstall_package "$package_name"

          if [ "$phase2_result" -ne 0 ]; then
            echo "ERROR: Phase 2 (vulnerable build) failed"
            exit 1
          fi

          echo ""
          echo "============================================"
          echo "Synthetic vulnerability test PASSED for ${vuln_id}"
          echo "============================================"
          EOF
