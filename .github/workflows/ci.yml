name: Check CIA tests
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_exit: ${{ steps.modified-dirs.outputs.should_exit || steps.build-matrices.outputs.should_exit }}
      has_non_app_changes: ${{ steps.modified-dirs.outputs.has_non_app_changes }}
      apk_jobs: ${{ steps.build-matrices.outputs.apk_jobs }}
      test_jobs: ${{ steps.build-matrices.outputs.test_jobs }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Disable Git ownership check
        run: git config --global --add safe.directory '*'
        
      - name: Fetch main branch
        run: git fetch origin main:refs/remotes/origin/main

      - name: Find modified directories
        id: modified-dirs
        run: |
          cat << 'EOF' > /tmp/shared_functions.sh
          get_modified_dirs() {
            git diff --diff-filter=ACMDR --name-only origin/main...HEAD |
              grep '^apps/' |
              xargs -n1 dirname |
              awk -F/ 'NF>=2 {print $1"/"$2}' |
              sort -u
          }
          EOF
          chmod +x /tmp/shared_functions.sh
          source /tmp/shared_functions.sh

          # Check if there are any changes outside apps/ directory
          all_changes=$(git diff --diff-filter=ACMDR --name-only origin/main...HEAD)
          non_app_changes=$(echo "$all_changes" | grep -v '^apps/' || true)

          if [ -n "$non_app_changes" ]; then
            echo "Detected changes outside apps/ directory:"
            echo "$non_app_changes"
            echo "has_non_app_changes=true" >> $GITHUB_OUTPUT
          else
            echo "All changes are within apps/ directory"
            echo "has_non_app_changes=false" >> $GITHUB_OUTPUT
          fi

          modified_dirs=$(get_modified_dirs)
          if [ -z "$modified_dirs" ]; then
            echo "No modified directories with essential changes found. Skipping further steps."
            echo "should_exit=true" >> $GITHUB_OUTPUT
          else
            echo "Modified directories:"
            echo "$modified_dirs"
            echo "modified_dirs<<EOF" >> $GITHUB_OUTPUT
            echo "$modified_dirs" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q
          pip install -e .

      - name: Build job matrices
        if: steps.modified-dirs.outputs.should_exit != 'true'
        id: build-matrices
        run: |
          set -e

          apk_jobs="[]"
          test_jobs="[]"

          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            app_name=$(basename "$dir")
            echo "=== Processing $dir (app: $app_name) ==="

            # Get SDK and Java from metadata.json
            metadata="$dir/metadata.json"
            if [ ! -f "$metadata" ]; then
              echo "ERROR: $metadata not found"
              exit 1
            fi

            sdk=$(jq -r '.sdk' "$metadata")
            if [ "$sdk" = "null" ] || [ -z "$sdk" ]; then
              echo "ERROR: Could not extract SDK from $metadata"
              exit 1
            fi

            java=$(jq -r '.java // 17' "$metadata")
            system_image=$(jq -r '.system_image // "google_atd"' "$metadata")
            echo "  SDK: $sdk, Java: $java, System image: $system_image"

            # Check for probes
            has_probes=false
            if [ -f "$dir/test_access_control.py" ] || [ -f "$dir/test_availability.py" ] || \
               [ -f "$dir/test_confidentiality.py" ] || [ -f "$dir/test_integrity.py" ]; then
              has_probes=true
            fi
            echo "  Has probes: $has_probes"

            # Check for server components
            has_server=false
            app_server=$(jq -r '.app_server // empty' "$metadata")
            [ -n "$app_server" ] && has_server=true
            echo "  Has server: $has_server"

            # Determine setup modes
            has_source=false
            has_apklink=false
            [ -f "$dir/build.sh" ] && has_source=true
            download_link=$(jq -r '.download_link // empty' "$metadata")
            [ -n "$download_link" ] && has_apklink=true

            if [ "$has_source" = false ] && [ "$has_apklink" = false ]; then
              echo "ERROR: Neither build.sh nor download_link found in $dir"
              echo "If this app builds from source, create a build.sh file."
              exit 1
            fi

            source_modified=$(git diff --name-only origin/main...HEAD | grep -qF "$dir/build.sh" && echo "true" || echo "false")
            apklink_modified=$(git diff --name-only origin/main...HEAD | grep -qF "$dir/metadata.json" && echo "true" || echo "false")
            core_modified=$(git diff --name-only origin/main...HEAD | grep -qE "^${dir}/(build\.sh|start_runtime\.sh|cleanup\.sh|metadata\.json|docker-compose\.yml|security\.patch)" && echo "true" || echo "false")

            setup_modes=()
            if [ "$has_source" = true ] && [ "$has_apklink" = true ]; then
              if [ "$source_modified" = "true" ] && [ "$apklink_modified" = "true" ]; then
                setup_modes=("source" "apklink")
              elif [ "$source_modified" = "true" ]; then
                setup_modes=("source")
              elif [ "$apklink_modified" = "true" ]; then
                setup_modes=("apklink")
              else
                setup_modes=("apklink")
              fi
            elif [ "$has_source" = true ]; then
              setup_modes=("source")
            else
              setup_modes=("apklink")
            fi
            echo "  Setup modes: ${setup_modes[*]}"

            # Check if PR touches synthetic_vulnerabilities/ for this app
            synth_changes=$(git diff --name-only origin/main...HEAD \
              | grep "^${dir}/synthetic_vulnerabilities/" || true)

            # If PR touches synthetic_vulnerabilities/ or core files, add synthetic vuln jobs
            if [ -n "$synth_changes" ] || [ "$core_modified" = "true" ]; then
              if [ "$core_modified" = "true" ]; then
                echo "  Detected core file changes for $app_name - retesting all synthetic vulnerabilities"
                # Find all vuln IDs for this app, excluding hidden directories
                vuln_ids=$(find "${dir}/synthetic_vulnerabilities" -maxdepth 1 -mindepth 1 -type d ! -name ".*" -exec basename {} \; 2>/dev/null | sort -u || true)
              else
                echo "  Detected synthetic vulnerability changes for $app_name"
                # Extract unique vuln IDs from changed paths
                vuln_ids=$(echo "$synth_changes" \
                  | sed "s|^${dir}/synthetic_vulnerabilities/||" \
                  | cut -d'/' -f1 \
                  | sort -u)
              fi

              for vuln_id in $vuln_ids; do
                vuln_dir="${dir}/synthetic_vulnerabilities/${vuln_id}"
                echo "  Checking synthetic vuln: $vuln_id"

                # Validate required files exist based on the declared harness
                # replay model in metadata.json.
                missing_files=false
                if [ ! -f "${vuln_dir}/metadata.json" ]; then
                  echo "  WARNING: Missing ${vuln_dir}/metadata.json — skipping $vuln_id"
                  continue
                fi
                attacker_model=$(jq -r '.attacker_model' "${vuln_dir}/metadata.json")
                case "$attacker_model" in
                  malicious_app)
                    # build_exploit_apk.sh is injected from templates/malicious_app
                    # at replay time, so it is not required to be checked in.
                    required_files=("vulnerability.patch" "exploit_files/exploit_apk/AndroidManifest.xml" "verify_files/verify_exploit.sh" "metadata.json")
                    ;;
                  remote_attacker)
                    required_files=("vulnerability.patch" "exploit_files/exploit.sh" "verify_files/verify_exploit.sh" "metadata.json")
                    ;;
                  *)
                    echo "  ERROR: Unsupported attacker_model '${attacker_model}' in ${vuln_dir}/metadata.json"
                    exit 1
                    ;;
                esac
                for req_file in "${required_files[@]}"; do
                  if [ ! -f "${vuln_dir}/${req_file}" ]; then
                    echo "  WARNING: Missing ${vuln_dir}/${req_file} — skipping $vuln_id"
                    missing_files=true
                    break
                  fi
                done
                if [ "$attacker_model" = "malicious_app" ] && [ "$missing_files" = false ]; then
                  if ! find "${vuln_dir}/exploit_files/exploit_apk/src" -name '*.java' -print -quit 2>/dev/null | grep -q .; then
                    echo "  WARNING: No Java sources under ${vuln_dir}/exploit_files/exploit_apk/src — skipping $vuln_id"
                    missing_files=true
                  fi
                fi
                [ "$missing_files" = true ] && continue

                # Validate metadata.json schema and on-disk exploit structure.
                # Mirrors run_ci_local.sh's load_vuln_test_settings +
                # validate_vuln_exploit_format so the two CIs enforce the same
                # attacker_model contract (e.g. malicious_app must NOT ship
                # exploit.sh; remote_attacker must NOT ship exploit_apk/).
                echo "  Validating metadata.json schema for $vuln_id..."
                if ! python3 -m pytest --no-header -q \
                  tests/test_synthetic_vuln_metadata.py::test_synthetic_vuln_metadata \
                  tests/test_synthetic_vuln_metadata.py::test_synthetic_vuln_exploit_structure \
                  --dirs "${vuln_dir}"; then
                  echo "  ERROR: metadata.json validation failed for ${vuln_dir}/metadata.json"
                  exit 1
                fi

                # Use apklink if available, but force source if vulnerability.patch,
                # the per-vuln metadata.json, build.sh, or app-level metadata.json changed.
                synth_mode="source"
                if [ "$has_apklink" = true ]; then
                  patch_changed=$(echo "$synth_changes" | grep -q "${vuln_id}/vulnerability.patch" && echo "true" || echo "false")
                  vuln_metadata_changed=$(echo "$synth_changes" | grep -q "${vuln_id}/metadata.json" && echo "true" || echo "false")
                  if [ "$patch_changed" = "false" ] && [ "$vuln_metadata_changed" = "false" ] && [ "$source_modified" = "false" ] && [ "$apklink_modified" = "false" ]; then
                    synth_mode="apklink"
                  else
                    echo "  vulnerability.patch, per-vuln metadata.json, build.sh, or app metadata.json changed — forcing source build for $vuln_id"
                  fi
                fi

                apk_jobs=$(echo "$apk_jobs" | jq -c --arg dir "$dir" --arg name "$app_name" \
                  --arg java "$java" --arg mode "$synth_mode" --arg vuln_id "$vuln_id" \
                  '. += [{"app_dir": $dir, "app_name": $name, "java": $java, "setup_mode": $mode, "vuln_id": $vuln_id}]')

                test_jobs=$(echo "$test_jobs" | jq -c --arg dir "$dir" --arg name "$app_name" \
                  --arg sdk "$sdk" --arg image "$system_image" --arg mode "$synth_mode" \
                  --arg type "synthetic_vuln" --arg vuln_id "$vuln_id" \
                  '. += [{"app_dir": $dir, "app_name": $name, "sdk": $sdk, "system_image": $image, "setup_mode": $mode, "test_type": $type, "vuln_id": $vuln_id}]')

                echo "  Added synthetic_vuln jobs for $vuln_id"
              done
            fi

            # Add regular CI jobs only if non-synthetic files changed
            non_synth_changes=$(git diff --name-only origin/main...HEAD \
              | grep "^${dir}/" | grep -v "^${dir}/synthetic_vulnerabilities/" || true)

            if [ -n "$non_synth_changes" ]; then
              # Build APK jobs for this app
              for mode in "${setup_modes[@]}"; do
                apk_jobs=$(echo "$apk_jobs" | jq -c --arg dir "$dir" --arg name "$app_name" \
                  --arg java "$java" --arg mode "$mode" \
                  '. += [{"app_dir": $dir, "app_name": $name, "java": $java, "setup_mode": $mode}]')
              done

              # Build test jobs for this app
              if [ "$has_probes" = true ]; then
                test_types=("baseline" "vuln_scenario_0")
                [ "$has_server" = true ] && test_types+=("vuln_scenario_1")
              else
                test_types=("simple")
              fi

              for mode in "${setup_modes[@]}"; do
                for test_type in "${test_types[@]}"; do
                  test_jobs=$(echo "$test_jobs" | jq -c --arg dir "$dir" --arg name "$app_name" \
                    --arg sdk "$sdk" --arg image "$system_image" --arg mode "$mode" --arg type "$test_type" \
                    '. += [{"app_dir": $dir, "app_name": $name, "sdk": $sdk, "system_image": $image, "setup_mode": $mode, "test_type": $type}]')
                done
              done
            fi
          done <<< "${{ steps.modified-dirs.outputs.modified_dirs }}"

          echo "APK jobs: $apk_jobs"
          echo "Test jobs: $test_jobs"

          if [ "$apk_jobs" = "[]" ]; then
            echo "should_exit=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_exit=false" >> "$GITHUB_OUTPUT"
          fi

          echo "apk_jobs=$apk_jobs" >> "$GITHUB_OUTPUT"
          echo "test_jobs=$test_jobs" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        if: steps.modified-dirs.outputs.has_non_app_changes == 'true'
        run: |
          echo "Running unit tests..."
          pytest tests/ -v --tb=short

      - name: Skip unit tests
        if: steps.modified-dirs.outputs.has_non_app_changes == 'false'
        run: |
          echo "Skipping unit tests - all changes are in apps/ directory"

      - name: Check metadata.json
        if: steps.modified-dirs.outputs.should_exit != 'true'
        run: |
          while IFS= read -r dir; do
            [ -z "$dir" ] && continue
            if git diff --name-only HEAD^ HEAD | grep -q "$dir/metadata.json"; then
              echo "metadata.json was modified in $dir. Running test..."
              pytest \
                --log-cli-level=INFO \
                --log-cli-format='%(message)s' \
                --tb=no \
                tests/test_metadata_json.py::test_app_metadata \
                --dirs "$dir"
            else
              echo "metadata.json not modified in $dir. Skipping test."
            fi
          done <<< "${{ steps.modified-dirs.outputs.modified_dirs }}"

  handle_apk:
    needs: setup
    if: needs.setup.outputs.should_exit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        include: ${{ fromJson(needs.setup.outputs.apk_jobs) }}
      fail-fast: false

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true # revert back to true if an app build fails due to disk space
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Disable Git ownership check
        run: git config --global --add safe.directory '*'

      - name: Initialize submodule
        run: |
          echo "Initialize submodule for ${{ matrix.app_dir }}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(echo -n "x-access-token:${{ secrets.GH_TOKEN }}" | base64)" submodule update --init "${{ matrix.app_dir }}"

      - name: Checkout commit from metadata
        run: |
          cd "${{ matrix.app_dir }}"

          if [[ -f "metadata.json" ]]; then
            commit=$(jq -r '.["commit_version"]' "metadata.json")

            if [[ -n "$commit" && "$commit" != "null" ]]; then
              echo "Found commit: $commit"
              cd codebase
              git reset --hard HEAD
              sudo git clean -fdx
              git checkout "$commit"
              cd ..
            else
              echo "No commit version found in metadata.json"
              exit 1
            fi
          else
            echo "No metadata.json file found"
            exit 1
          fi

      - name: Check for Gradle files
        if: matrix.setup_mode == 'source'
        id: check-gradle
        run: |
          cd "${{ matrix.app_dir }}"

          # Check for any build.gradle* files in app directory or codebase subdirectory
          if find . -name "build.gradle*" -type f | grep -q .; then
            echo "Gradle build files found"
            echo "has_gradle=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Gradle build files found"
            echo "has_gradle=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: "${{ matrix.java }}"
          cache: ${{ steps.check-gradle.outputs.has_gradle == 'true' && 'gradle' || ''}}

      - name: APK output cache
        if: matrix.setup_mode == 'source'
        id: apk-cache
        uses: actions/cache@v4
        with:
          path: ${{ matrix.app_dir }}/apk
          key: apk-${{ matrix.app_name }}-${{ matrix.vuln_id || 'clean' }}-${{ hashFiles(format('{0}/metadata.json', matrix.app_dir), format('{0}/build.sh', matrix.app_dir), format('{0}/synthetic_vulnerabilities/{1}/vulnerability.patch', matrix.app_dir, matrix.vuln_id), 'build_apk.sh', 'utils/*.sh') }}

      - name: Build or download APK
        if: matrix.setup_mode != 'source' || steps.apk-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GRADLE_OPTS: "-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g -XX:MaxMetaspaceSize=1g"
        run: |
          cd "${{ matrix.app_dir }}"

          echo "Setup mode: ${{ matrix.setup_mode }}"

          if [ "${{ matrix.setup_mode }}" = "apklink" ]; then
            echo "Downloading APK from link..."
            cd ../..
            python download_apk.py "${{ matrix.app_name }}"
            cd "${{ matrix.app_dir }}"
          else
            echo "Building APK from source..."
            if [ -f "build.sh" ]; then
              echo "Using new build system (build.sh + build_apk.sh)"
              cd ../..
              ./build_apk.sh "${{ matrix.app_name }}"
              cd "${{ matrix.app_dir }}"
            else
              echo "ERROR: build.sh not found for ${{ matrix.app_name }}"
              echo ""
              echo "=============================================="
              echo "MIGRATION REQUIRED"
              echo "=============================================="
              echo "This app still uses the legacy setup_app_source.sh."
              echo "Please migrate to the new build system:"
              echo ""
              echo "1. Create apps/${{ matrix.app_name }}/build.sh with build commands"
              echo "2. The script should output unsigned APK to \$SCRIPT_DIR/unsigned.apk"
              echo "3. Signing is handled by build_apk.sh"
              echo ""
              echo "See apps/grocy/build.sh for an example."
              echo "=============================================="
              exit 1
            fi
          fi

          # Validate APK Path
          echo "Validating APK path..."
          APK_DIR="apk"
          if [ ! -d "$APK_DIR" ]; then
            echo "ERROR: APK directory not found at $APK_DIR"
            echo "ERROR: APKs must be placed in ${{ matrix.app_dir }}/apk/"
            exit 1
          fi

          APK_COUNT=$(find "$APK_DIR" -maxdepth 1 -name "*.apk" -type f 2>/dev/null | wc -l)
          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK found in $APK_DIR/"
            echo "ERROR: build_apk.sh or download_apk.py must place APKs in ${{ matrix.app_dir }}/apk/"
            exit 1
          fi

          echo "APK path validated - found $APK_COUNT APK(s) in $APK_DIR/"

          # For apklink + synthetic vuln, verify the bundle includes the vuln APK
          if [ "${{ matrix.setup_mode }}" = "apklink" ] && [ -n "${{ matrix.vuln_id }}" ]; then
            VULN_APK_DIR="apk/${{ matrix.vuln_id }}"
            VULN_APK_COUNT=$(find "$VULN_APK_DIR" -maxdepth 1 -name "*.apk" -type f 2>/dev/null | wc -l)
            if [ "$VULN_APK_COUNT" -eq 0 ]; then
              echo "ERROR: Downloaded APK bundle does not contain vulnerable APK for ${{ matrix.vuln_id }}."
              echo "  The bundle at download_link needs to be rebuilt and republished:"
              echo "    ./build_apk.sh ${{ matrix.app_name }}"
              echo "    ./build_apk.sh ${{ matrix.app_name }} --vuln ${{ matrix.vuln_id }}"
              echo "    ./publish_apk_bundle.sh apps/${{ matrix.app_name }}"
              exit 1
            fi
            echo "Vulnerable APK found in bundle: $VULN_APK_DIR/ ($VULN_APK_COUNT APK(s))"
          fi

      - name: Build vulnerable APK for synthetic vulnerability
        if: matrix.vuln_id != '' && matrix.setup_mode == 'source' && steps.apk-cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GRADLE_OPTS: "-Xmx4g -Dkotlin.daemon.jvm.options=-Xmx2g -XX:MaxMetaspaceSize=1g"
        run: |
          cd "${{ matrix.app_dir }}"
          cd ../..
          ./build_apk.sh "${{ matrix.app_name }}" --vuln "${{ matrix.vuln_id }}"
          cd "${{ matrix.app_dir }}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app_name }}-${{ matrix.setup_mode }}${{ matrix.vuln_id && format('-{0}', matrix.vuln_id) || '' }}-${{ github.run_id }}
          path: |
            ${{ matrix.app_dir }}/apk/*.apk
            ${{ matrix.app_dir }}/apk/${{ matrix.vuln_id }}/*.apk
          retention-days: 1
          if-no-files-found: error

      - name: Cleanup Gradle daemons
        if: always()
        run: |
          cd "${{ matrix.app_dir }}" || true
          (cd codebase && ./gradlew --stop) || true
          pkill -f GradleDaemon || true
          pkill -f kotlin.daemon.KotlinCompileDaemon || true

  test:
    needs: [setup, handle_apk]
    if: needs.setup.outputs.should_exit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      matrix:
        include: ${{ fromJson(needs.setup.outputs.test_jobs) }}
      fail-fast: false

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: true # revert back to true if an app build fails due to disk space
          docker-images: true
          swap-storage: true

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.GH_TOKEN }}

      - name: Disable Git ownership check
        run: git config --global --add safe.directory '*'

      - name: Create shared functions
        run: |
          cat << 'EOF' > /tmp/shared_functions.sh
          check_app_containers_ready() {
            # Timeout per container in seconds
            TIMEOUT=${TIMEOUT:-180}
            # Interval between checks in seconds
            INTERVAL=${INTERVAL:-1}

            # Get app-specific containers from metadata.json
            containers=""
            if [ -f "metadata.json" ]; then
              # Check for explicit container_names field
              container_names=$(jq -r '.container_names[]? // empty' metadata.json 2>/dev/null)
              if [ -n "$container_names" ]; then
                containers="$container_names"
                echo "Found explicit container_names in metadata.json: $containers"
              fi
            fi

            if [ -z "$containers" ]; then
              echo "No app-specific containers found in metadata.json - skipping container readiness check"
              return 0
            fi

            echo "Checking readiness for app-specific containers: $containers"

            for container in $containers; do
              echo "Checking readiness for $container..."

              # Check if container has a health check
              has_health=$(docker inspect --format '{{if .Config.Healthcheck}}true{{else}}false{{end}}' "$container")
              if [ "$has_health" = "true" ]; then
                echo "Container has a health check. Waiting to become healthy..."
                elapsed=0
                success=0
                while [ $elapsed -lt $TIMEOUT ]; do
                  status=$(docker inspect --format '{{.State.Health.Status}}' "$container" 2>/dev/null)
                  if [ "$status" == "healthy" ]; then
                    success=1
                    break
                  fi
                  sleep "$INTERVAL"
                  elapsed=$((elapsed + INTERVAL))
                done
                if [ $success -eq 1 ]; then
                  echo "$container is healthy."
                  continue
                else
                  echo "Timeout: $container did not become healthy within $TIMEOUT seconds." >&2
                  exit 1
                fi
              else
                # Get exposed TCP ports
                ports=$(docker inspect --format '{{range $p, $conf := .NetworkSettings.Ports}}{{range $conf}}{{.HostPort}} {{end}}{{end}}' "$container")
                if [ -z "$ports" ]; then
                  echo "No exposed ports for $container. Skipping readiness check." >&2
                  continue
                fi

                elapsed=0
                all_success=0
                while [ $elapsed -lt $TIMEOUT ]; do
                  success=1
                  for port_spec in $ports; do
                    port=$(echo "$port_spec" | cut -d'/' -f1)
                    proto=$(echo "$port_spec" | cut -d'/' -f2)
                    if [ "$proto" != "tcp" ]; then
                      continue  # Skip non-TCP ports
                    fi

                    # Perform TCP check
                    if ! nc -z -w 1 localhost "$port" &>/dev/null; then
                      success=0
                      break
                    fi
                  done

                  if [ $success -eq 1 ]; then
                    all_success=1
                    break
                  fi

                  sleep "$INTERVAL"
                  elapsed=$((elapsed + INTERVAL))
                done

                if [ $all_success -eq 1 ]; then
                  echo "$container is ready via port check on all ports."
                else
                  echo "Timeout: $container not ready after $TIMEOUT seconds." >&2
                  exit 1
                fi
              fi
            done

            echo "App-specific containers are ready!"
          }

          checkout_commit() {
            pwd
            if [[ -f "metadata.json" ]]; then
              commit=$(jq -r '.["commit_version"] // empty' "metadata.json")

              if [[ -n "$commit" ]]; then
                echo "Found commit: $commit"

                git submodule update --init codebase
                echo "Cleaning repository to remove all changes and untracked files..."

                cd "codebase" || exit 1

                echo "Cleaning up the codebase"
                git reset --hard HEAD
                sudo git clean -fdx

                # Update the submodule and checkout the commit
                git checkout "$commit"

                cd - || exit 1
              else
                echo "No commit version found in metadata.json"
                exit 1
              fi
            else
              echo "No metadata.json file found"
              exit 1
            fi
          }

          verify_shared_net_connectivity() {
            # Verify shared_net connectivity after containers are started
            echo "Verifying shared_net connectivity..."
            if [ -f "metadata.json" ]; then
              app_server=$(jq -r '.app_server // empty' "metadata.json")
              if [ -n "$app_server" ]; then
                echo "Testing connectivity to: $app_server"
                
                # Strip protocol prefix if present (http://, https://)
                server_clean=$(echo "$app_server" | sed 's|^[^:]*://||')
                echo "  Raw app_server: $app_server"
                echo "  Cleaned server: $server_clean"
                
                # Parse host and port - require explicit port
                if [[ "$server_clean" == *":"* ]]; then
                  host=$(echo "$server_clean" | cut -d':' -f1)
                  port=$(echo "$server_clean" | cut -d':' -f2)
                  echo "  Parsed host: $host"
                  echo "  Parsed port: $port"
                else
                  echo "ERROR: No port specified in app_server: $app_server"
                  exit 1
                fi
                
                echo "  Testing connection to $host:$port via shared_net..."
                docker run --rm --network=shared_net alpine:latest \
                  sh -c "nc -z -w 30 $host $port || (echo 'ERROR: Cannot reach app server via shared_net' && exit 1)"

                echo "shared_net connectivity verified"
              else
                echo "No app_server defined in metadata.json, skipping connectivity check"
              fi
            else
              echo "No metadata.json found, skipping connectivity check"
            fi
          }

          start_ssrf_listener() {
            echo "Starting SSRF listener container..."
            local root_dir="${GITHUB_WORKSPACE:-$(pwd)}"
            local ssrf_compose_dir="$root_dir/evaluation/ssrf_listener"
            
            if [ ! -d "$ssrf_compose_dir" ]; then
              echo "WARNING: SSRF listener directory not found at $ssrf_compose_dir"
              return 1
            fi
            
            # Stop any existing SSRF listener
            docker compose -f "$ssrf_compose_dir/docker-compose.yml" down -v 2>/dev/null || true
            
            # Build and start the SSRF listener
            if docker compose -f "$ssrf_compose_dir/docker-compose.yml" up -d --build --wait; then
              echo "SSRF listener started on port 14377"
              return 0
            else
              echo "WARNING: Failed to start SSRF listener"
              return 1
            fi
          }

          stop_ssrf_listener() {
            echo "Stopping SSRF listener container..."
            local root_dir="${GITHUB_WORKSPACE:-$(pwd)}"
            local ssrf_compose_dir="$root_dir/evaluation/ssrf_listener"
            
            if [ -d "$ssrf_compose_dir" ]; then
              docker compose -f "$ssrf_compose_dir/docker-compose.yml" down -v 2>/dev/null || true
            fi
            
            # Also try to stop container directly in case compose fails
            docker stop ssrf-probe 2>/dev/null || true
            docker rm -f ssrf-probe 2>/dev/null || true
            
            echo "SSRF listener stopped"
          }

          clear_ssrf_requests() {
            echo "Clearing SSRF request log..."
            docker exec ssrf-probe rm -f /app/logs/ssrf_requests.json 2>/dev/null || true
          }

          EOF
          chmod +x /tmp/shared_functions.sh

          echo "Initialize submodule for ${{ matrix.app_dir }}"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $(echo -n "x-access-token:${{ secrets.GH_TOKEN }}" | base64)" submodule update --init "${{ matrix.app_dir }}"

      - name: Setup Python 3.12 environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          sudo apt-get update
          # libpulse0 — emulator audio dep
          # sqlcipher — apps/nextcloud-talk probe_lib decrypts Room DB
          sudo apt-get install -y libpulse0 sqlcipher
          python -m pip install --upgrade pip -q
          pip install -r requirements.txt -q
          pip install -e .

      - name: Create Docker Networks
        # agent_net is internal:true; the agent's only L3 egress is the Squid sidecar.
        run: |
          docker network create shared_net || true
          docker network create --internal agent_net || true

      - name: Start SSRF Listener
        run: |
          source /tmp/shared_functions.sh
          start_ssrf_listener || echo "WARNING: SSRF listener not started - SSRF detection may not work"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

