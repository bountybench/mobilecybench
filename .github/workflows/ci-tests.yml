name: Test MetaMask
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DIR: metamask
      
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: Fetch main branch
        run: git fetch origin main:refs/remotes/origin/main

      - name: Set up JDK
        id: setup-java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpulse0

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      
      - name: Parse metadata
        id: parse-metadata
        run: |
          set -e

          metadata="$DIR/metadata.json"
          if [ ! -f "$metadata" ]; then
            echo "ERROR: $metadata not found"
            exit 1
          fi

          vuln_version=$(jq -r '.app_vulnerable_version' "$metadata")
          if ! vuln_version=$(jq -r '.app_vulnerable_version' "$metadata") || [ "$vuln_version" = "null" ] || [ -z "$vuln_version" ]; then
            echo "ERROR: Could not extract vulnerable version of app from $metadata."
            exit 1
          fi

          patched_version=$(jq -r '.app_patched_version' "$metadata")
          if ! patched_version=$(jq -r '.app_patched_version' "$metadata") || [ "$patched_version" = "null" ] || [ -z "$patched_version" ]; then
            echo "ERROR: Could not extract patched version of app from $metadata."
            exit 1
          fi

          echo "Now in $(pwd)"
          cd "$DIR" || exit 1
          echo "Now in $(pwd)"

          exploit_script="exploit.sh"
          verify_script="verify.sh"
          setup_app_script="setup_app.sh"

          # Check if scripts exist and are executable
          for script in "$exploit_script" "$verify_script" "$setup_app_script"; do
            if [ ! -f "$script" ]; then
              echo -e "ERROR: Could not find $script"
              exit 1
            fi
            chmod +x "$script"
          done

          echo -e "CHECKING IF NECESSARY SCRIPTS EXIST"
          echo -e "SUCCESS: Found exploit script at: ${exploit_script}"
          echo -e "SUCCESS: Found verify script at: ${verify_script}"
          echo -e "SUCCESS: Found setup app script at: ${setup_app_script}"

          # Export versions for use in subsequent steps
          {
            echo "vuln_version=$vuln_version"
            echo "patched_version=$patched_version"
            echo "exploit_script=$exploit_script"
            echo "verify_script=$verify_script"
            echo "setup_app_script=$setup_app_script"
          } >> "$GITHUB_OUTPUT"

      - name: Create exploit test script
        run: |
          echo "Generating test_exploit.sh"

          vuln_version="${{ steps.parse-metadata.outputs.vuln_version }}"
          verify_script="${{ steps.parse-metadata.outputs.verify_script }}"
          exploit_script="${{ steps.parse-metadata.outputs.exploit_script }}"

          echo "verify_script=${verify_script}"
          echo "exploit_script=${exploit_script}"
          echo "vuln_version=${vuln_version}"

          cat << EOF > test_exploit.sh
          #!/bin/bash
          set -e

          adb wait-for-device
          adb shell getprop sys.boot_completed
          adb devices
          adb shell input keyevent 82

          cd "$DIR" || { echo "Failed to cd into $DIR"; exit 1; }

          vuln_version="${vuln_version}"
          verify_script="${verify_script}"
          exploit_script="${exploit_script}"

          echo "::group::SETTING UP THE APP"
          ./setup_app.sh "$vuln_version"
          echo "::endgroup::"

          echo "::group::RUNNING VERIFY SCRIPT BEFORE EXPLOIT"
          initial_log=$(./"$verify_script")
          initial_status=$?
          echo "$verify_script"
          ls -l "./$verify_script" || echo "Script not found"
          file "./$verify_script" || echo "Could not determine file type"
          [[ ! -x "./$verify_script" ]] && echo "Script is not executable"
          head -n 1 "./$verify_script" || echo "Failed to read script"

          echo "initial status"
          echo $initial_status
          
          if [[ ${initial_status} -eq 0 ]]; then
            echo "ERROR: Verify script before exploit should fail"
            echo "${initial_log}"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::EXPLOIT"
          ./"$exploit_script"
          sleep 5
          echo "::endgroup::"

          echo "::group::VERIFY AFTER EXPLOIT"
          final_log=$(./"$verify_script")
          final_status=$?
          if [[ ${final_status} -ne 0 ]]; then
            echo "ERROR: Verify script after exploit should succeed but returned ${final_status}"
            echo "${final_log}"
            exit 1
          fi
          echo "SUCCESS: Exploit mode succeeded"
          echo "::endgroup::"
          EOF

          chmod +x test_exploit.sh

      - name: Test Exploit Workflow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -skin 1080x1920 -memory 2048 -camera-back none
          disable-animations: true
          script: ./test_exploit.sh

      - name: Create patch test script
        run: |
          echo "Generating test_exploit.sh"

          patched_version="${{ steps.parse-metadata.outputs.patched_version }}"
          verify_script="${{ steps.parse-metadata.outputs.verify_script }}"
          exploit_script="${{ steps.parse-metadata.outputs.exploit_script }}"

          cat << 'EOF' > test_patch.sh
          #!/bin/bash
          set -e

          adb wait-for-device
          adb shell getprop sys.boot_completed
          adb devices
          adb shell input keyevent 82

          cd "$DIR" || { echo "Failed to cd into $DIR"; exit 1; }

          echo "::group::APPLYING PATCH"
          patched_version="${patched_version}"
          verify_script="${verify_script}"
          exploit_script="${exploit_script}"
          echo "::endgroup::"

          echo "::group::SETTING UP THE APP"
          ./setup_app.sh "$patched_version"
          echo "::endgroup::"

          echo "::group::RUNNING VERIFY SCRIPT BEFORE EXPLOIT"
          initial_log=$(./"$verify_script")
          initial_status=$?
          if [[ ${initial_status} -eq 0 ]]; then
            echo "ERROR: Verify script before exploit should fail (return 1)"
            echo "${initial_log}"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::EXPLOIT"
          ./"$exploit_script"
          sleep 5
          echo "::endgroup::"

          echo "::group::RUNNING VERIFY SCRIPT AFTER EXPLOIT"
          final_log=$(./"$verify_script")
          final_status=$?
          if [[ ${final_status} -eq 0 ]]; then
            echo "ERROR: Verify script after patch should still fail (return 1), but it returned 0"
            echo "========= Error log ========="
            echo "${final_log}"
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::PATCH MODE SUCCEEDED"
          echo "Patch completed successfully."
          echo "::endgroup::"
          EOF

          chmod +x test_patch.sh

      - name: Test Patch Workflow
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          target: google_apis
          force-avd-creation: false
          emulator-options: -no-snapshot-save -wipe-data -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -skin 1080x1920 -memory 2048 -camera-back none
          disable-animations: true
          script: ./test_patch.sh