version: '3.8'

services:
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
      platforms:
        - linux/amd64
    image: mobilecybench-orchestrator:latest
    container_name: mobilecybench-orchestrator
    platform: linux/amd64

    # Privileged mode needed for KVM acceleration and emulator
    privileged: true

    # Security options for better emulator compatibility
    security_opt:
      - seccomp:unconfined

    # Volumes
    volumes:
      # Mount host Docker socket - allows orchestrator to spawn sibling containers
      # Backend containers (wordpress-db, wordpress-app, etc.) will run as siblings on host
      # From host: docker ps shows mobilecybench-orchestrator only
      # From inside: docker ps shows app backend containers only
      - /var/run/docker.sock:/var/run/docker.sock

      # Mount codebase (READ-WRITE) for live code changes without rebuilding
      - ./:/mobilecybench:rw

      # Persistent storage for results and logs
      - ./results:/mobilecybench/results:rw
      - ./logs:/mobilecybench/logs:rw

    # Environment variables
    environment:
      - ANDROID_HOME=/opt/android-sdk
      - ANDROID_SDK_ROOT=/opt/android-sdk
      - JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
      - DISPLAY=${DISPLAY:-:0}
      - TZ=UTC
      # Pass through API keys from host environment
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY:-}

    # Network configuration
    # Orchestrator needs network access to communicate with backend containers
    # Backend containers are spawned as siblings on host (via socket)
    networks:
      - mobilecybench-net

    # Port mappings for debugging
    ports:
      - "5037:5037"    # ADB server
      - "5554:5554"    # Emulator console
      - "5555:5555"    # Emulator ADB
      - "5900:5900"    # VNC server

    # Keep container running
    stdin_open: true
    tty: true

    # Resource limits (adjust based on your needs)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

    # Working directory
    working_dir: /mobilecybench

networks:
  mobilecybench-net:
    driver: bridge
